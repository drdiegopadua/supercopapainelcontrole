<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Súmula Digital · Supercopa AFC Vôlei</title>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<style>
:root{--blue:#1565c0;--dark:#111827;--grey:#6b7280;--border:#e5e7eb;--bg:#f4f6fb;--green:#16a34a;--red:#dc2626;--yellow:#eab308;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--dark);padding-bottom:100px;}
header{background:linear-gradient(135deg,#0d1f5c,#1565c0);color:#fff;padding:20px 18px;text-align:center;}
header .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.75;margin-bottom:6px;}
header h1{font-size:20px;font-weight:800;}
header .sub{font-size:12px;opacity:.7;margin-top:4px;}
.wrap{max-width:640px;margin:0 auto;padding:16px;}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.card h2{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card h2 i{color:var(--blue);font-size:18px;}
.teams-row{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:800;font-size:17px;text-align:center;}
.teams-row .vs{color:var(--grey);font-size:12px;font-weight:700;}
.loading, .err{text-align:center;padding:40px 20px;color:var(--grey);}
.err{color:var(--red);}
.field-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select{padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fbfcfe;}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);}
.team-col{flex:1;min-width:0;}
.team-col-title{font-size:13px;font-weight:800;margin-bottom:8px;padding:6px 10px;border-radius:8px;background:#eef3fc;color:var(--blue);text-align:center;}
.escalacao-grid{display:flex;gap:12px;}
.titular-input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:6px;width:100%;}
.libero-input{border-color:#f4c542;background:#fffaf0;}
.sets-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.set-box{text-align:center;}
.set-box .lbl{font-size:11px;font-weight:700;color:var(--grey);margin-bottom:6px;}
.set-box input{width:100%;text-align:center;font-size:20px;font-weight:800;padding:10px 4px;border:2px solid var(--border);border-radius:10px;}
.set-box input:focus{outline:none;border-color:var(--blue);}
.resultado-live{text-align:center;margin-top:14px;padding:12px;border-radius:10px;background:#f4f6fb;font-weight:800;font-size:16px;}
.timeout-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6;}
.timeout-row:last-child{border-bottom:none;}
.stepper{display:flex;align-items:center;gap:10px;}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:16px;font-weight:800;color:var(--blue);}
.stepper span{min-width:20px;text-align:center;font-weight:800;}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8f9fc;border-radius:10px;margin-bottom:8px;font-size:13px;}
.list-item .info{flex:1;}
.list-item button{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;}
.add-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.add-row select,.add-row input{flex:1;min-width:90px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
.btn-add{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;}
.badge-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;}
.badge-amarelo{background:#fef9c3;color:#854d0e;}
.badge-vermelho{background:#fee2e2;color:#991b1b;}
.footer-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.06);}
.btn-save{flex:1;background:linear-gradient(135deg,#1565c0,#0d1f5c);color:#fff;border:none;padding:15px;border-radius:12px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-save:disabled{opacity:.6;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2);}
.toast.show{display:block;}
.toast.ok{background:var(--green);}
.toast.error{background:var(--red);}
@media(max-width:420px){.escalacao-grid{flex-direction:column;}.field-group{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header>
  <div class="tag">Supercopa AFC · Vôlei</div>
  <h1 id="hdrTitle">Súmula Digital</h1>
  <div class="sub" id="hdrSub">Carregando jogo...</div>
</header>

<div class="wrap" id="wrap">
  <div class="loading" id="loadingState"><i class='bx bx-loader-alt bx-spin' style="font-size:28px"></i><p style="margin-top:10px">Carregando dados do jogo...</p></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUMULA_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIG8Zfi9aIZO9Pcc3vKwWBzU7Jty1bJgcL3JSHQrR0K4dJ4KsYdl8eu3lfVoskKUsoYA/exec";
const PLACAR_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbznh7KfIJxIEF-aWd2TMIZ8l2XWdFoKrjU5xdo7HCRtRzYBkAL0v3AgucYRRj9b9eQH/exec";

const params = new URLSearchParams(location.search);
const jogoId = (params.get('jogo') || '').toUpperCase();

const ROW_MAP_GRUPOS = { A1:11, A2:12, A3:13, B1:23, B2:24, B3:25, C1:35, C2:36, C3:37, D1:47, D2:48, D3:49 };
const ROW_MAP_MATA = { Q1:6, Q2:7, Q3:8, Q4:9, SF1:13, SF2:14, FINAL:18 };
function resolverJogoLocal(id){
  if (ROW_MAP_GRUPOS[id]) return { aba:'Fase de Grupos', linha: ROW_MAP_GRUPOS[id], numero: id.slice(1) };
  if (ROW_MAP_MATA[id]) return { aba:'Mata-Mata', linha: ROW_MAP_MATA[id], numero: id };
  return null;
}

let state = {
  aba: '', linha: '', numero: '',
  equipeA: '', equipeB: '',
  titularesA: ['','','','','',''], liberoA: '',
  titularesB: ['','','','','',''], liberoB: '',
  sets: [{a:'',b:''},{a:'',b:''},{a:'',b:''}],
  timeoutsA: [0,0,0], timeoutsB: [0,0,0],
  cartoes: [], substituicoes: [],
  arbitro: '', anotador: '', local: ''
};

function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(()=>t.classList.remove('show'), 3500);
}

async function init(){
  if (!jogoId){
    document.getElementById('wrap').innerHTML = '<div class="err"><i class="bx bx-error-circle" style="font-size:32px"></i><p style="margin-top:8px">Link inválido: falta o parâmetro do jogo.</p></div>';
    return;
  }
  const jogoLocal = resolverJogoLocal(jogoId);
  if (!jogoLocal){
    document.getElementById('wrap').innerHTML = '<div class="err"><i class="bx bx-error-circle" style="font-size:32px"></i><p style="margin-top:8px">Jogo não reconhecido: ' + jogoId + '</p></div>';
    return;
  }
  state.aba = jogoLocal.aba;
  state.linha = jogoLocal.linha;
  state.numero = jogoLocal.numero;
  try{
    const res = await fetch(SUMULA_SCRIPT_URL + '?action=jogo&id=' + encodeURIComponent(jogoId)).then(r=>r.json());
    if (!res.ok){
      document.getElementById('wrap').innerHTML = '<div class="err"><i class="bx bx-error-circle" style="font-size:32px"></i><p style="margin-top:8px">' + (res.erro || 'Jogo não encontrado.') + '</p></div>';
      return;
    }
    state.equipeA = res.equipeA || 'Equipe Casa';
    state.equipeB = res.equipeB || 'Equipe Visitante';

    if (res.sumula){
      const s = res.sumula;
      state.titularesA = (s.titularesCasa && s.titularesCasa.length) ? s.titularesCasa : state.titularesA;
      state.liberoA = s.liberoCasa || '';
      state.titularesB = (s.titularesVisitante && s.titularesVisitante.length) ? s.titularesVisitante : state.titularesB;
      state.liberoB = s.liberoVisitante || '';
      state.sets = (s.sets && s.sets.length) ? s.sets : state.sets;
      state.timeoutsA = (s.timeoutsCasa && s.timeoutsCasa.length) ? s.timeoutsCasa : state.timeoutsA;
      state.timeoutsB = (s.timeoutsVisitante && s.timeoutsVisitante.length) ? s.timeoutsVisitante : state.timeoutsB;
      state.cartoes = s.cartoes || [];
      state.substituicoes = s.substituicoes || [];
      state.arbitro = s.arbitro || '';
      state.anotador = s.anotador || '';
      state.local = s.local || '';
    } else if (res.sets){
      state.sets = res.sets.map(s => ({a: s.a || '', b: s.b || ''}));
    }

    document.getElementById('hdrTitle').textContent = jogoId + ' · ' + state.equipeA + ' vs ' + state.equipeB;
    document.getElementById('hdrSub').textContent = 'Preencha a súmula e salve ao final da partida';
    render();
  } catch(ex){
    document.getElementById('wrap').innerHTML = '<div class="err"><i class="bx bx-error-circle" style="font-size:32px"></i><p style="margin-top:8px">Erro ao carregar: ' + ex.message + '</p></div>';
  }
}

function render(){
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = `
    <div class="card">
      <div class="teams-row"><span>${state.equipeA}</span><span class="vs">VS</span><span>${state.equipeB}</span></div>
    </div>

    <div class="card">
      <h2><i class='bx bxs-user-detail'></i> Escalação Titular</h2>
      <div class="escalacao-grid">
        <div class="team-col">
          <div class="team-col-title">${state.equipeA}</div>
          ${[0,1,2,3,4,5].map(i => `<input class="titular-input" placeholder="Titular ${i+1}" value="${state.titularesA[i]||''}" onchange="state.titularesA[${i}]=this.value">`).join('')}
          <input class="titular-input libero-input" placeholder="🟡 Líbero" value="${state.liberoA||''}" onchange="state.liberoA=this.value">
        </div>
        <div class="team-col">
          <div class="team-col-title">${state.equipeB}</div>
          ${[0,1,2,3,4,5].map(i => `<input class="titular-input" placeholder="Titular ${i+1}" value="${state.titularesB[i]||''}" onchange="state.titularesB[${i}]=this.value">`).join('')}
          <input class="titular-input libero-input" placeholder="🟡 Líbero" value="${state.liberoB||''}" onchange="state.liberoB=this.value">
        </div>
      </div>
    </div>

    <div class="card">
      <h2><i class='bx bxs-trophy'></i> Placar por Set (melhor de 3)</h2>
      <div class="sets-grid">
        ${[0,1,2].map(i => `
          <div class="set-box">
            <div class="lbl">SET ${i+1}</div>
            <input type="number" min="0" max="99" value="${state.sets[i].a}" oninput="state.sets[${i}].a=this.value;updateResultado()" placeholder="0">
            <div style="height:6px"></div>
            <input type="number" min="0" max="99" value="${state.sets[i].b}" oninput="state.sets[${i}].b=this.value;updateResultado()" placeholder="0">
          </div>`).join('')}
      </div>
      <div class="resultado-live" id="resultadoLive"></div>
    </div>

    <div class="card">
      <h2><i class='bx bx-time-five'></i> Timeouts Técnicos</h2>
      ${[0,1,2].map(i => `
        <div class="timeout-row">
          <span>Set ${i+1} · ${state.equipeA}</span>
          <div class="stepper">
            <button onclick="alterarTimeout('A',${i},-1)">−</button>
            <span id="toA${i}">${state.timeoutsA[i]||0}</span>
            <button onclick="alterarTimeout('A',${i},1)">+</button>
          </div>
        </div>
        <div class="timeout-row">
          <span>Set ${i+1} · ${state.equipeB}</span>
          <div class="stepper">
            <button onclick="alterarTimeout('B',${i},-1)">−</button>
            <span id="toB${i}">${state.timeoutsB[i]||0}</span>
            <button onclick="alterarTimeout('B',${i},1)">+</button>
          </div>
        </div>`).join('')}
    </div>

    <div class="card">
      <h2><i class='bx bxs-flag-alt'></i> Cartões / Advertências</h2>
      <div id="cartoesList">${renderCartoes()}</div>
      <div class="add-row">
        <select id="cartaoEquipe"><option value="${state.equipeA}">${state.equipeA}</option><option value="${state.equipeB}">${state.equipeB}</option></select>
        <input id="cartaoJogador" placeholder="Jogador(a)">
        <select id="cartaoTipo"><option value="Amarelo">🟨 Amarelo</option><option value="Vermelho">🟥 Vermelho</option></select>
        <select id="cartaoSet"><option value="1">Set 1</option><option value="2">Set 2</option><option value="3">Set 3</option></select>
        <button class="btn-add" onclick="addCartao()">Adicionar</button>
      </div>
    </div>

    <div class="card">
      <h2><i class='bx bx-transfer'></i> Substituições</h2>
      <div id="substList">${renderSubs()}</div>
      <div class="add-row">
        <select id="subEquipe"><option value="${state.equipeA}">${state.equipeA}</option><option value="${state.equipeB}">${state.equipeB}</option></select>
        <input id="subSaiu" placeholder="Saiu">
        <input id="subEntrou" placeholder="Entrou">
        <select id="subSet"><option value="1">Set 1</option><option value="2">Set 2</option><option value="3">Set 3</option></select>
        <button class="btn-add" onclick="addSub()">Adicionar</button>
      </div>
    </div>

    <div class="card">
      <h2><i class='bx bx-note'></i> Informações Gerais</h2>
      <div class="field-group">
        <div class="field"><label>Árbitro</label><input value="${state.arbitro||''}" onchange="state.arbitro=this.value"></div>
        <div class="field"><label>Anotador(a)</label><input value="${state.anotador||''}" onchange="state.anotador=this.value"></div>
      </div>
      <div class="field"><label>Local</label><input value="${state.local||''}" onchange="state.local=this.value"></div>
    </div>
  `;
  updateResultado();
}

function renderCartoes(){
  if (!state.cartoes.length) return '<p style="color:var(--grey);font-size:13px">Nenhum cartão registrado.</p>';
  return state.cartoes.map((c,i) => `
    <div class="list-item">
      <span class="badge-tag badge-${c.tipo==='Vermelho'?'vermelho':'amarelo'}">${c.tipo==='Vermelho'?'🟥':'🟨'}</span>
      <div class="info"><strong>${c.jogador}</strong> · ${c.equipe} · Set ${c.set}</div>
      <button onclick="removerCartao(${i})"><i class='bx bx-x'></i></button>
    </div>`).join('');
}

function renderSubs(){
  if (!state.substituicoes.length) return '<p style="color:var(--grey);font-size:13px">Nenhuma substituição registrada.</p>';
  return state.substituicoes.map((s,i) => `
    <div class="list-item">
      <div class="info"><strong>${s.equipe}</strong> · Set ${s.set} · ${s.saiu} ➜ ${s.entrou}</div>
      <button onclick="removerSub(${i})"><i class='bx bx-x'></i></button>
    </div>`).join('');
}

function alterarTimeout(time, setIdx, delta){
  const arr = time === 'A' ? state.timeoutsA : state.timeoutsB;
  arr[setIdx] = Math.max(0, Math.min(2, (arr[setIdx]||0) + delta));
  document.getElementById('to'+time+setIdx).textContent = arr[setIdx];
}

function addCartao(){
  const jogador = document.getElementById('cartaoJogador').value.trim();
  if (!jogador){ showToast('Informe o nome do jogador(a).', 'error'); return; }
  state.cartoes.push({
    equipe: document.getElementById('cartaoEquipe').value,
    jogador: jogador,
    tipo: document.getElementById('cartaoTipo').value,
    set: document.getElementById('cartaoSet').value
  });
  document.getElementById('cartoesList').innerHTML = renderCartoes();
  document.getElementById('cartaoJogador').value = '';
}
function removerCartao(i){ state.cartoes.splice(i,1); document.getElementById('cartoesList').innerHTML = renderCartoes(); }

function addSub(){
  const saiu = document.getElementById('subSaiu').value.trim();
  const entrou = document.getElementById('subEntrou').value.trim();
  if (!saiu || !entrou){ showToast('Informe quem saiu e quem entrou.', 'error'); return; }
  state.substituicoes.push({
    equipe: document.getElementById('subEquipe').value,
    saiu: saiu, entrou: entrou,
    set: document.getElementById('subSet').value
  });
  document.getElementById('substList').innerHTML = renderSubs();
  document.getElementById('subSaiu').value = '';
  document.getElementById('subEntrou').value = '';
}
function removerSub(i){ state.substituicoes.splice(i,1); document.getElementById('substList').innerHTML = renderSubs(); }

function updateResultado(){
  const el = document.getElementById('resultadoLive');
  if (!el) return;
  const setsA = state.sets.filter(s => parseInt(s.a||0) > parseInt(s.b||0)).length;
  const setsB = state.sets.filter(s => parseInt(s.b||0) > parseInt(s.a||0)).length;
  el.textContent = `${state.equipeA} ${setsA} × ${setsB} ${state.equipeB}`;
}

async function salvarSumula(){
  const btn = document.getElementById('btnSalvar');
  btn.disabled = true;
  btn.innerHTML = '<i class="bx bx-loader-alt bx-spin"></i> Salvando...';
  try{
    const payload = {
      acao: 'salvarSumula',
      id: jogoId,
      equipeA: state.equipeA, equipeB: state.equipeB,
      titularesA: state.titularesA, liberoA: state.liberoA,
      titularesB: state.titularesB, liberoB: state.liberoB,
      sets: state.sets,
      timeoutsA: state.timeoutsA, timeoutsB: state.timeoutsB,
      cartoes: state.cartoes, substituicoes: state.substituicoes,
      arbitro: state.arbitro, anotador: state.anotador, local: state.local,
      status: 'Encerrada'
    };
    const res = await fetch(SUMULA_SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) }).then(r=>r.json());
    if (!res.ok){
      showToast('❌ Erro ao salvar súmula: ' + (res.erro || 'desconhecido'), 'error');
      return;
    }

    // Atualiza o placar por set na planilha de jogos (mesmo endpoint
    // já usado pelo botão "Enviar Placar" no painel).
    const dadosPlacar = [
      state.numero || '',
      state.equipeA,
      (state.sets[0].a||'').toString(), (state.sets[1].a||'').toString(), (state.sets[2].a||'').toString(),
      res.setsVencidosA.toString(),
      'X',
      (state.sets[0].b||'').toString(), (state.sets[1].b||'').toString(), (state.sets[2].b||'').toString(),
      res.setsVencidosB.toString(),
      state.equipeB,
      res.setsVencidosA.toString(), res.setsVencidosB.toString(),
      res.vencedor,
      '', state.local || ''
    ];
    const resPlacar = await fetch(PLACAR_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao: 'atualizar_placar_volei', aba: state.aba, linha: state.linha, dados: dadosPlacar })
    }).then(r=>r.json()).catch(ex => ({ ok:false, erro: ex.message }));

    if (resPlacar.ok){
      showToast('✅ Súmula salva! ' + state.equipeA + ' ' + res.setsVencidosA + ' × ' + res.setsVencidosB + ' ' + state.equipeB, 'ok');
    } else {
      showToast('⚠️ Súmula salva, mas o placar público não atualizou: ' + (resPlacar.erro || 'erro desconhecido'), 'error');
    }
  } catch(ex){
    showToast('❌ Erro: ' + ex.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bx bxs-cloud-upload"></i> Salvar Súmula';
  }
}

init();
</script>

<div class="footer-bar">
  <button class="btn-save" id="btnSalvar" onclick="salvarSumula()"><i class='bx bxs-cloud-upload'></i> Salvar Súmula</button>
</div>

</body>
</html>
