  TELÃO LED 4 x 2 m — SUPERCOPA AFC DE VÔLEI · v4 "CAMPANHA"
  Linguagem de campanha esportiva premium: base clara, fitas de vidro líquido
  azul/violeta, tipografia larga (Unbounded) e momento escuro para o campeão.

  • Palco 1920 x 960 (2:1) escalado para o player do LED.
  • 6 fases (painel.fase): pre · apresentacao · jogos · publicidade · entretenimento · encerramento
  • Dados: carregarDados() → mesmo formato de PAINEL_DATA_MOCK (fim do arquivo)
  • data-slot="caminho" marca cada dado dinâmico · tecla M mostra/esconde
  • OPERADOR: mexa o mouse → aparece o painel de controle (fases e telas). Some sozinho.
  • Teclas: 1–6 fase · 0 volta p/ planilha · ← → tela · Espaço pausa · M marcações · F tela cheia
            Alertas de teste: S set point · X match point · E fim de set · J fim de jogo · T tempo técnico · D desafio
  • URL: ?fase=jogos  ?tela=aovivo  ?pausa=1  ?slots=0
  ============================================================================

<style>
  :root{
    /* cores da marca (logo oficial): dourado #FABF35 · marinho #1B2A4E · branco */
    --gold:#2f5bff; --brandgold:#fabf35; --navy:#0d1a4a; --navy2:#13244f; --blue:#2f5bff; --blue2:#5b8cff;
    --ink:#0d1a4a; --ink2:#3b4a78; --mut:#8592b8; --line:rgba(30,60,160,.1);
    --b1:#2f5bff; --b2:#2f5bff; --v1:#5b8cff; --v2:#9fc0ff; --c1:#5b8cff;
    --grad:linear-gradient(120deg,#5b8cff 0%,#3d6bff 45%,#2340e8 100%);
    --grad-t:linear-gradient(180deg,#6f9bff 0%,#3d6bff 45%,#1f36d6 100%);
    --glass:rgba(255,255,255,.74); --glass-b:rgba(255,255,255,.98);
    --shadow:0 30px 60px -24px rgba(40,80,220,.28),0 8px 24px -12px rgba(13,26,74,.1);
    --F:'Unbounded','Arial Black',sans-serif; --B:'Manrope',system-ui,sans-serif;
    --slot:#ff7a45;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  body{font-family:var(--B);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:none}
  body.cursor{cursor:default}
  .num{font-variant-numeric:tabular-nums}

  /* =================== PALCO =================== */
  #stage{width:1920px;height:960px;position:relative;flex:none;overflow:hidden;
    background:radial-gradient(900px 600px at 50% -10%,#dfe8ff 0%,transparent 70%),linear-gradient(180deg,#f4f7ff 0%,#ffffff 45%,#eef3ff 100%);transition:background 1.2s}
  #stage.dark{background:radial-gradient(1200px 800px at 50% 30%,#4f7dff 0%,#2340e8 35%,#122aa8 70%,#0a1a6b 100%)}
  /* esferas azuis brilhantes (estilo vidro) */
  .orbs{position:absolute;inset:0;pointer-events:none;z-index:0}
  .orb{position:absolute;border-radius:50%;transition:transform 2.2s cubic-bezier(.6,0,.2,1),opacity 1s;
    background:radial-gradient(circle at 30% 28%,#ffffff 0%,#c9dbff 10%,#7ea6ff 30%,#3d6bff 58%,#2340e8 80%,#1a2fb8 100%);
    box-shadow:inset -30px -40px 80px rgba(10,20,120,.35),inset 20px 20px 60px rgba(255,255,255,.35),0 40px 80px -20px rgba(47,91,255,.45)}
  .orb>i{position:absolute;inset:0;border-radius:50%;animation:orbF 9s ease-in-out infinite alternate}
  .orb.o1{width:420px;height:420px;left:-310px;top:300px}
  .orb.o2{width:560px;height:560px;right:-230px;bottom:-200px}
  .orb.o3{width:180px;height:180px;right:330px;top:-70px;opacity:.9}
  .orb.o4{width:120px;height:120px;left:42%;bottom:-40px;opacity:.85}
  .orbw{position:absolute;inset:0;animation:orbF 10s ease-in-out infinite alternate}
  .orbw.w2{animation-duration:13s;animation-direction:alternate-reverse}
  @keyframes orbF{from{transform:translate(0,0)}to{transform:translate(26px,-30px)}}
  #stage[data-tela="boasvindas"] .orb.o2{transform:translate(-40px,40px) scale(.8)}
  #stage[data-tela="boasvindas"] .orb.o1{transform:translate(-60px,330px) scale(.8)}
  #stage[data-tela="contagem"] .orb.o1{transform:translate(-60px,-120px) scale(.8)}
  #stage[data-tela="aovivo"] .orb.o1,#stage[data-tela="classificacao"] .orb.o1,#stage[data-tela="quiz"] .orb.o1{transform:translate(-140px,0) scale(.7)}
  #stage[data-tela="aovivo"] .orb.o2,#stage[data-tela="classificacao"] .orb.o2{transform:translate(60px,120px) scale(.7)}
  #stage[data-tela="proximo"] .orb.o1{transform:translate(-40px,-160px) scale(1.1)}
  #stage[data-tela="proximo"] .orb.o2{transform:translate(-60px,-40px) scale(1.1)}
  #stage[data-tela="equipes"] .orb.o3{transform:translate(-900px,40px) scale(1.4)}
  #stage[data-tela="publicidade"] .orb.o3{transform:translate(-600px,30px)}
  #stage.dark .orb{opacity:.55}

  /* fitas de vidro líquido (fundo global, mudam de posição a cada tela) */
  .ribbons{position:absolute;inset:-10%;width:120%;height:120%;pointer-events:none;transition:opacity 1s}
  .rib{transition:transform 2.2s cubic-bezier(.6,0,.2,1);transform-origin:960px 480px}
  .rib .fl{animation:float 14s ease-in-out infinite alternate;transform-origin:960px 480px}
  .rib.r2 .fl{animation-duration:18s;animation-direction:alternate-reverse}
  .rib.r3 .fl{animation-duration:11s}
  @keyframes float{from{transform:translate(-30px,10px) rotate(-2deg)}to{transform:translate(40px,-20px) rotate(2deg)}}
  #stage[data-tela="boasvindas"] .rib.r1{transform:translate(120px,-40px) rotate(-6deg) scale(1.08)}
  #stage[data-tela="boasvindas"] .rib.r2{transform:translate(-200px,80px) rotate(10deg)}
  #stage[data-tela="contagem"] .rib.r1{transform:translate(-160px,140px) rotate(8deg)}
  #stage[data-tela="contagem"] .rib.r3{transform:translate(260px,-60px) rotate(-12deg) scale(1.2)}
  #stage[data-tela="aovivo"] .rib{transform:translate(0,320px) scale(1.15)}
  #stage[data-tela="classificacao"] .rib{transform:translate(0,330px) rotate(4deg)}
  #stage[data-tela="equipes"] .rib.r1{transform:translate(-380px,60px) rotate(-14deg) scale(1.1)}
  #stage[data-tela="equipes"] .rib.r2{transform:translate(-300px,-120px) rotate(18deg)}
  #stage[data-tela="proximo"] .rib.r1{transform:translate(0,-40px) rotate(-4deg) scale(1.25)}
  #stage[data-tela="proximo"] .rib.r2{transform:translate(0,60px) rotate(6deg) scale(1.2)}
  #stage[data-tela="publicidade"] .rib.r1{transform:rotate(-20deg) scale(1.1)}
  #stage[data-tela="publicidade"] .rib.r3{transform:rotate(25deg) scale(1.15)}
  #stage[data-tela="quiz"] .rib{transform:translate(200px,280px) rotate(-6deg)}
  #stage[data-tela="galera"] .rib{transform:translate(-100px,-260px) rotate(8deg)}
  #stage[data-tela="podio"] .rib.r1{transform:translate(0,-220px) scale(1.2)}
  #stage[data-tela="premiacao"] .rib{transform:translate(0,300px)}
  #stage[data-tela="agradecimento"] .rib.r1{transform:translate(100px,-180px) rotate(-8deg) scale(1.15)}
  .ribbons{opacity:.35}
  #stage[data-tela="boasvindas"] .ribbons,#stage[data-tela="contagem"] .ribbons,#stage[data-tela="proximo"] .ribbons{opacity:.55}
  #stage.dark .ribbons{opacity:.55}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:0}
  /* feixes de luz de arena */
  .beam{position:absolute;top:-260px;width:340px;height:1500px;transform-origin:50% 0;filter:blur(30px);opacity:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,236,180,.9),rgba(47,91,255,.25) 40%,transparent 75%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
  .beam.b1{left:260px;animation:sweepA 11s ease-in-out infinite alternate}
  .beam.b2{right:240px;animation:sweepB 13s ease-in-out infinite alternate;background:linear-gradient(180deg,rgba(190,215,255,.9),rgba(61,123,255,.25) 40%,transparent 75%)}
  @keyframes sweepA{from{transform:rotate(-22deg)}to{transform:rotate(14deg)}}
  @keyframes sweepB{from{transform:rotate(20deg)}to{transform:rotate(-16deg)}}
  /* poeira dourada flutuando */
  .dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .dust i{position:absolute;bottom:-20px;border-radius:50%;background:#9fc0ff;box-shadow:0 0 8px #5b8cff;animation:rise linear infinite}
  /* varredura de luz na troca de tela */
  #sweep{position:absolute;top:-10%;bottom:-10%;width:420px;left:-600px;z-index:20;pointer-events:none;transform:skewX(-18deg);opacity:0;
    background:linear-gradient(90deg,transparent,rgba(91,140,255,0) 10%,rgba(91,140,255,.35) 40%,rgba(255,255,255,.95) 50%,rgba(91,140,255,.3) 62%,transparent);filter:blur(6px)}
  #sweep.go{animation:sweepX 1.1s cubic-bezier(.65,0,.25,1)}
  @keyframes sweepX{0%{left:-600px;opacity:1}100%{left:2300px;opacity:.3}}
  /* tipografia cinética (letra a letra) */
  .kin{display:inline-block;white-space:nowrap}
  .kin>span{display:inline-block;will-change:transform}
  .kin.gt{background:none;-webkit-background-clip:initial;background-clip:initial;color:inherit}

  @keyframes letter{from{opacity:0;transform:translateY(.6em) rotate(8deg) scale(.6);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
  /* número que "salta" quando muda */
  .pop{animation:pop .7s cubic-bezier(.2,1.6,.3,1)}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.22);filter:drop-shadow(0 0 30px rgba(47,91,255,.9))}100%{transform:scale(1)}}
  /* flutuação suave */
  .float{animation:floatY 6s ease-in-out infinite}
  @keyframes floatY{50%{transform:translateY(-14px)}}
  /* logo oficial com brilho passando */
  .logo-wrap{position:relative;display:inline-block;width:100%}
  .logo-wrap>img{display:block;width:100%;height:auto;filter:drop-shadow(0 20px 50px rgba(0,0,0,.5))}
  .logo-wrap .shine{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 48%,rgba(255,240,190,.7) 52%,transparent 65%);background-size:300% 100%;
    animation:shine 4.5s ease-in-out infinite}
  @keyframes shine{0%,40%{background-position:120% 0}100%{background-position:-80% 0}}

  /* =================== CABEÇALHO (mínimo) =================== */
  .hdr{position:absolute;left:56px;right:56px;top:32px;height:70px;display:flex;align-items:center;z-index:6;transition:color 1s}
  .brand{display:flex;align-items:center;gap:18px}
  .brand .lg{width:104px;height:87px;filter:drop-shadow(0 8px 16px rgba(13,26,74,.15))}

    box-shadow:var(--shadow);font-size:13px;font-weight:800;letter-spacing:4px;text-transform:uppercase}

  .rdot{width:10px;height:10px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 0 0 rgba(255,59,92,.6);animation:rp 1.6s infinite}
  @keyframes rp{70%{box-shadow:0 0 0 12px rgba(255,59,92,0)}100%{box-shadow:0 0 0 0 rgba(255,59,92,0)}}
  .hdr .right{display:flex;align-items:center;gap:22px}

  .clock .d{font-size:11px;letter-spacing:4px;color:var(--mut);text-transform:uppercase;font-weight:700;margin-top:6px}
  .qr-s{width:70px;height:70px;border-radius:18px;background:#fff;padding:7px;box-shadow:var(--shadow);position:relative}
  .qr-s span{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:2px;color:#fff;background:var(--grad);padding:3px 8px;border-radius:10px}
  #stage.dark .hdr{color:#fff}

  #stage.dark .brand .sb,#stage.dark .clock .d{color:rgba(255,255,255,.55)}

  /* =================== RODAPÉ: faixa de logos =================== */
  .ftr{position:absolute;left:56px;right:56px;bottom:26px;height:84px;display:flex;align-items:center;gap:18px;z-index:6;
    background:linear-gradient(120deg,rgba(91,140,255,.92),rgba(35,64,232,.95));border:1px solid rgba(255,255,255,.4);border-radius:28px;box-shadow:var(--shadow);padding:0 14px 0 26px;overflow:hidden;
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:background 1s,border-color 1s}

  .ftr .run-wrap{flex:1;overflow:hidden;height:100%;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  .ftr .run{display:flex;align-items:center;gap:22px;height:100%;width:max-content;animation:run 50s linear infinite}
  @keyframes run{to{transform:translateX(-50%)}}
  .ftr .lgx{width:150px;height:58px;border-radius:14px;background:#fff;overflow:hidden;flex:none;box-shadow:0 4px 14px rgba(10,18,56,.06)}
  .ftr .div{width:1px;height:50px;background:rgba(255,255,255,.35);flex:none}
  .ftr .real{display:flex;gap:10px;flex:none}
  .ftr .real .lgx{width:130px}
  .prog{position:absolute;left:56px;right:56px;bottom:118px;height:3px;border-radius:3px;background:rgba(47,91,255,.1);z-index:6;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--grad);border-radius:3px}
  #stage.dark .prog{background:rgba(255,255,255,.1)}

  /* =================== TELAS =================== */
  .screens{position:absolute;left:56px;right:56px;top:122px;bottom:136px;z-index:3}
  .screen{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(1.035);filter:blur(16px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1),filter .9s}
  .screen.active{opacity:1;transform:none;filter:none}
  .screen.active .rv{animation:rv 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 1s + .15s)}
  @keyframes rv{from{opacity:0;transform:translateY(40px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
  .screen.active .rvx{animation:rvx 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 1s + .15s)}
  @keyframes rvx{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}

  /* =================== COMPONENTES =================== */
  .glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:34px;box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);position:relative}

  .pill{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:30px;font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase;white-space:nowrap}

  .circle{border-radius:50%;background:#fff;overflow:hidden;flex:none;box-shadow:0 24px 50px -16px rgba(40,80,220,.4),0 0 0 8px rgba(255,255,255,.85);position:relative}
  .circle img{width:100%;height:100%;object-fit:contain;padding:13%}
  .circle.photo img{object-fit:cover;padding:0}
  .gauge{border-radius:50%;position:relative;flex:none;background:conic-gradient(from 210deg,#1f36d6,#3d6bff calc(var(--p) * .6),#9fc0ff var(--p),rgba(47,91,255,.1) var(--p))}
  .gauge>.in{position:absolute;inset:var(--w,14px);border-radius:50%;background:linear-gradient(150deg,#ffffff,#eef3ff);display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:inset 0 2px 6px rgba(255,255,255,.9),0 10px 24px -10px rgba(40,80,220,.3)}
  .btn{display:flex;align-items:center;justify-content:center;height:72px;border-radius:40px;background:var(--grad);color:#fff;font-family:var(--F);font-weight:700;font-size:20px;letter-spacing:2px;
    text-transform:uppercase;box-shadow:0 20px 40px -12px rgba(47,91,255,.6)}

  .slider i{position:absolute;left:0;top:0;bottom:0;border-radius:12px;background:var(--grad)}

  .slider b::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--blue)}
  .info{display:flex;align-items:center;gap:0}

    letter-spacing:3px;text-transform:uppercase;background:repeating-linear-gradient(135deg,rgba(47,91,255,.06) 0 12px,rgba(47,91,255,.02) 12px 24px)}
  .ph svg{width:34%;max-width:70px;height:auto;stroke:#8fa0cc;fill:none;stroke-width:1.5}
  .circle .ph,.lgx .ph,.qr .ph,.qr-s .ph,.ad .tl .lg .ph,.ty .t .lg .ph,.sp-card .lg .ph,.vd .cap .sp .lg .ph,#vfull .corner .ph{background:repeating-linear-gradient(135deg,rgba(11,22,51,.07) 0 12px,rgba(11,22,51,.02) 12px 24px);color:#8f9abb}
  .circle .ph svg,.lgx .ph svg,.qr .ph svg,.qr-s .ph svg,.ad .tl .lg .ph svg,.ty .t .lg .ph svg,.sp-card .lg .ph svg,.vd .cap .sp .lg .ph svg{stroke:#8f9abb}

  /* bola de vôlei 3D */
  .ball{position:absolute;filter:drop-shadow(0 50px 70px rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(47,91,255,.25))}

  @keyframes bob{50%{transform:translateY(-18px)}}

  /* =================== 01 CONTAGEM =================== */
  .cd{height:100%;display:grid;grid-template-columns:1fr 520px;gap:40px}

  /* =================== 03 AO VIVO =================== */
  .lv{height:100%;display:flex;flex-direction:column;gap:26px}

  #alerta.c-volt .al-sc{border-color:rgba(11,22,51,.3)!important}
  #alerta.c-volt .bar{background:#0d1a4a}
  #alerta.c-deep{--a1:#0d1a4a;--a2:#2340e8}
  #alerta .flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards}
  @keyframes flash{to{opacity:0}}
  #alerta .rings{position:absolute;left:50%;top:50%;width:10px;height:10px}
  #alerta .rings i{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:ring 2.4s ease-out infinite}
  #alerta .rings i:nth-child(2){animation-delay:.8s}#alerta .rings i:nth-child(3){animation-delay:1.6s}
  @keyframes ring{from{width:100px;height:100px;margin:-50px;opacity:1}to{width:2400px;height:2400px;margin:-1200px;opacity:0}}
  #alerta .al-k{position:relative;font-size:18px;font-weight:800;letter-spacing:10px;text-transform:uppercase;opacity:0;animation:rv .7s .2s both}
  #alerta .al-t{position:relative;font-family:var(--F);font-weight:900;line-height:.9;letter-spacing:-6px;text-transform:uppercase;white-space:nowrap;margin:24px 0 10px;
    text-shadow:0 30px 80px rgba(0,0,0,.25);animation:slam .7s cubic-bezier(.2,1.3,.3,1) both}
  @keyframes slam{from{transform:scale(1.6);opacity:0;filter:blur(24px)}to{transform:none;opacity:1;filter:none}}
  #alerta .al-s{position:relative;font-size:22px;font-weight:700;letter-spacing:6px;text-transform:uppercase;opacity:.85;animation:rv .7s .35s both}
  #alerta .al-w{position:relative;display:flex;align-items:center;gap:30px;margin-top:46px;padding:18px 36px 18px 18px;border-radius:100px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);animation:rv .7s .45s both}
  #alerta .al-w .circle{width:120px;height:120px;box-shadow:none}
  #alerta .al-w .nm{font-family:var(--F);font-weight:800;font-size:56px;text-transform:uppercase;letter-spacing:-1px}
  #alerta .al-w .al-sc{font-family:var(--F);font-weight:300;font-size:56px;padding-left:30px;border-left:2px solid rgba(255,255,255,.4)}
  #alerta .bar{position:absolute;left:0;bottom:0;height:8px;background:#fff;opacity:.8;animation:abar linear forwards}
  @keyframes abar{from{width:100%}to{width:0}}

  /* =================== PAINEL DO OPERADOR (aparece ao mexer o mouse) =================== */
  #op{position:absolute;left:50%;top:112px;transform:translate(-50%,-20px);z-index:50;opacity:0;pointer-events:none;transition:.3s;
    padding:14px 18px;border-radius:24px;background:rgba(10,18,56,.92);color:#fff;box-shadow:0 30px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;min-width:900px}
  /* body.cursor #op{opacity:1;pointer-events:auto;transform:translate(-50%,0)} */
  #op .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #op .lb{font-size:10px;font-weight:800;letter-spacing:3px;color:rgba(255,255,255,.5);text-transform:uppercase;width:70px}
  #op button{font:700 13px var(--B);color:#fff;background:rgba(255,255,255,.1);border:0;border-radius:12px;padding:8px 14px;cursor:pointer}
  #op button.on{background:var(--grad);color:#fff}
  #op button.al{background:rgba(255,59,92,.25)}

  /* =================== MARCAÇÃO DE SLOTS =================== */
  :where([data-slot]){position:relative}
  /* camada de marcação: desenhada por cima de tudo (não é cortada por cartões/círculos) */
  #slotLayer{position:absolute;inset:0;z-index:70;pointer-events:none;display:none}
  body.slots #slotLayer{display:block}
  #slotLayer .bx{position:absolute;border:2px dashed var(--slot);border-radius:6px;background:rgba(255,122,69,.06)}
  #slotLayer .lb{position:absolute;left:-2px;top:-20px;display:flex;gap:4px;align-items:center;white-space:nowrap;font:700 11px/1 ui-monospace,Menlo,Consolas,monospace;color:#fff}
  #slotLayer .lb b{background:#0d1a4a;padding:4px 6px;border-radius:5px}
  #slotLayer .lb span{background:var(--slot);padding:4px 7px;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  #slotLayer .bx.low .lb{top:auto;bottom:-20px}
  .slot-banner{position:absolute;left:50%;transform:translateX(-50%);top:0;z-index:60;font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;color:#fff;background:var(--slot);padding:6px 12px;border-radius:0 0 10px 10px;display:none}
  body.slots .slot-banner{display:block}
</style>

<script>
/* =============================================================================
   CONFIGURAÇÃO
   ============================================================================= */
const CONFIG = {
  atualizarDadosACada: 5,    // s — placar ao vivo
  equipeTrocaACada: 10,      // s
  patrocinadorTrocaACada: 4, // s
  mensagemTrocaACada: 7,     // s
  fotoTrocaACada: 6,         // s
  mostrarSlots: false,       // marcações laranja desligadas em produção
  alertaDuracao: 6, alertasAutomaticos: true, melhorDe: 5,
  dominioUltimosPontos: 10, sequenciaMinima: 3,
  videoDuracaoMax: 60, videoSemArquivo: 8,
};
const TELAS = {
  contagem:{n:'Contagem',dur:20}, boasvindas:{n:'Boas-vindas',dur:20}, equipes:{n:'Equipes',dur:60}, aovivo:{n:'Ao vivo',dur:30},
  proximo:{n:'Próximo jogo',dur:15}, classificacao:{n:'Classificação',dur:20}, publicidade:{n:'Patrocinadores',dur:15}, quiz:{n:'Quiz',dur:20},
  galera:{n:'Galera',dur:25}, resultado:{n:'Resultado',dur:18}, podio:{n:'Pódio',dur:18}, campeao:{n:'Campeão',dur:25},
  premiacao:{n:'Premiação',dur:22}, agradecimento:{n:'Obrigado',dur:18}, video:{n:'Vídeo',dur:30},
};
const FASES = {
  pre:            { nome:'Pré-evento',   telas:['boasvindas','contagem','video','publicidade'] },
  apresentacao:   { nome:'Equipes',      telas:['equipes','publicidade'] },
  jogos:          { nome:'Jogos',        telas:['aovivo','proximo','aovivo','classificacao','video','publicidade'] },
  publicidade:    { nome:'Publicidade',  telas:['publicidade','video'] },
  entretenimento: { nome:'Diversão',     telas:['quiz','galera','video','publicidade'] },
  encerramento:   { nome:'Encerramento', telas:['resultado','podio','campeao','premiacao','agradecimento'] },
};
const ESCURAS = ['campeao'];   // telas em modo escuro

/* =============================================================================
   FONTE DE DADOS — Supercopa AFC (integração real)
   ============================================================================= */
async function carregarDados(){
  const API  = 'https://hngwasixgyvnvfanpuax.supabase.co/functions/v1/api';
  const SITE = 'https://www.supercopaafc.com.br/';
  const APP  = 'https://drdiegopadua.github.io/supercopa-app/';
  const S = p => p.catch(()=>null);
  const J = (a,p) => S(fetch(API+'?'+new URLSearchParams({action:a,...(p||{})}),{cache:'no-store'}).then(r=>r.json()));
  const qr = u => 'https://api.qrserver.com/v1/create-qr-code/?size=480x480&margin=0&data='+encodeURIComponent(u);
  const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  const P = (slug,nm,cota)=>({ nome:nm, cota, logo:SITE+'novo/parceiros/'+slug+'.png' });

  // leitura paralela da API
  const [t, tm, ao, rk, gl, sel, av] = await Promise.all([
    J('torneio',{modalidade:'volei'}), J('timesPublicos'), J('partidasAoVivo'),
    J('ranking_quiz'), J('galeriaLista'), J('telaoFotos'), J('telaoAviso')
  ]);

  // fase controlada pelo painel de controle (localStorage)
  const faseCtrl = (()=>{ try{ return localStorage.getItem('sc-telao-fase')||null; }catch(e){return null;} })();

  if(!t || !t.ok) return { ...PAINEL_DATA_MOCK, painel:{fase:faseCtrl||'jogos'} };

  // mapa de times
  const _ESC3D = {'alpha volei':'alpha-volei','ct das montanhas':'ct-das-montanhas','ctv aravolei':'ctv-aravolei','ctva voleibol':'ctva-voleibol','equipe uvi':'equipe-uvi','es volei':'es-volei','ms volei':'ms-volei','rpb volei':'rpb-volei','super volei':'super-volei','supra volei':'supra-volei','tiger volley':'tiger-volley','uniao volei':'uniao-volei'};
  const escudo3D = n=>{ const k=norm(n); return _ESC3D[k]?SITE+'novo/escudos/'+_ESC3D[k]+'.png':null; };
  const TM = {};
  ((tm&&tm.times)||[]).forEach(x=>{
    const logoOvr = escudo3D(x.nome);
    TM[norm(x.nome)] = { logo: logoOvr||(x.escudo||''), cidade: String(x.cidade||'').replace(/\s*-\s*[A-Z]{2}$/,''),
      grupo: x.grupo||'', naipe: x.naipe||'Masculino', tecnico: x.tecnico||'', atletas: (x.atletas||[]).map(a=>({numero:a.numero||'',nome:a.nome||'',posicao:a.posicao||'',foto:a.foto||''})) };
  });
  const logo = n => (TM[norm(n)]||{}).logo || escudo3D(n) || '';
  const cid  = n => (TM[norm(n)]||{}).cidade || '';
  const jg   = t.jogos || [];
  const vivos = {}; ((ao&&ao.partidas)||[]).forEach(p=>{ vivos[String(p.id).toUpperCase()] = p; });
  const nome = (j,k) => k==='c' ? (j.casaDefinida===false?(j.rotuloCasa||'A definir'):j.casa) : (j.visitanteDefinida===false?(j.rotuloVisitante||'A definir'):j.visitante);
  const FASE = {grupos:'Fase de grupos',quartas:'Quartas de final',semifinal:'Semifinal',final:'Grande final'};
  const statusDe = j => vivos[String(j.id).toUpperCase()] ? 'ao_vivo' : (j.status==='finalizado'||j.status==='wo')?'encerrado':j.status==='ao_vivo'?'ao_vivo':'agendado';
  const haVivo = jg.some(j=>statusDe(j)==='ao_vivo');

  // equipes (para fase apresentacao)
  const equipes = ((tm&&tm.times)||[]).map(x=>{
    const info = TM[norm(x.nome)]||{};
    return { nome:x.nome, cidade:info.cidade, grupo:info.grupo, naipe:info.naipe, tecnico:info.tecnico, escudo:info.logo||'', atletas:info.atletas||[] };
  });

  // classificação
  const grupos = (t.grupos||[]).filter(g=>g.tabela&&g.tabela.length).map(g=>{
    return { letra:g.grupo, jogosRealizados:g.jogosFeitos||0, jogosTotal:g.jogosTotal||3, classificam:2,
      aoVivo: jg.some(j=>j.fase==='grupos'&&j.grupo===g.grupo&&statusDe(j)==='ao_vivo'),
      times: g.tabela.map(x=>({ nome:x.equipe, logo:logo(x.equipe), pontos:x.pontos||0, v:x.vitorias||0, d:x.derrotas||0, saldoSets:x.saldoSets||0 })) };
  });

  // jogos ao vivo (formato novo)
  const jogosAoVivo = ((ao&&ao.partidas)||[]).map(p=>{
    const j = jg.find(x=>String(x.id).toUpperCase()===String(p.id).toUpperCase())||{};
    const faseN = j.fase==='grupos'?'Grupo '+(j.grupo||''):(FASE[j.fase]||j.fase||'');
    const qdrN = /altern/i.test(j.quadra||'')?'Quadra alternativa':'Quadra principal';
    return { quadra:qdrN, fase:faseN, setAtual:(p.setAtual||((p.setsCasa||0)+(p.setsVisitante||0)+1)),
      saque:p.saque||'A', melhorDe:CONFIG.melhorDe,
      timeA:{nome:nome(j,'c')||p.casa||'', logo:logo(nome(j,'c')||p.casa||'')},
      timeB:{nome:nome(j,'v')||p.visitante||'', logo:logo(nome(j,'v')||p.visitante||'')},
      setsA:p.setsCasa||0, setsB:p.setsVisitante||0,
      pontosA:p.pontosCasa||0, pontosB:p.pontosVisitante||0,
      parciais:(p.parciais||[]), ultimosPontos:(p.ultimosPontos||[]) };
  });

  // próximos jogos
  const hoje = new Date().toISOString().slice(0,10);
  const proximos = jg.filter(j=>statusDe(j)==='agendado').sort((a,b)=>((a.data||'')+(a.hora||'')).localeCompare((b.data||'')+(b.hora||''))).slice(0,4);
  const proximosJogos = proximos.map(j=>{
    const dt = j.data?String(j.data).split('-').reverse().slice(0,2).join('/'):hoje.split('-').reverse().slice(0,2).join('/');
    const faseN = j.fase==='grupos'?'Grupo '+(j.grupo||''):(FASE[j.fase]||j.fase||'');
    const qdrN = /altern/i.test(j.quadra||'')?'Quadra alternativa':'Quadra principal';
    return { data:dt, hora:j.hora||'--:--', quadra:qdrN, fase:faseN,
      timeA:{nome:nome(j,'c'), logo:logo(nome(j,'c'))}, timeB:{nome:nome(j,'v'), logo:logo(nome(j,'v'))} };
  });

  // patrocinadores
  const patrocinadores = [
    P('coroa-instituto','Coroa Instituto','master'),
    P('planet-sports','Planet Sports','prata'), P('acai-do-diego','Açaí do Diego','prata'), P('casa-homem-do-campo','Casa Homem do Campo','prata'),
    P('sicredi','Sicredi','prata'), P('express-pizzas-e-lanches','Express Pizzas e Lanches','prata'), P('izi-internet','IZI Internet','prata'),
    P('prato-fino','Prato Fino','bronze'), P('restaurante-do-marcao','Restaurante do Marcão','bronze'), P('elite-suplementos','Elite Suplementos','bronze'),
    P('jacare-fotografia','Jacaré Fotografia','bronze'), P('laboratorio-cda','Laboratório CDA','bronze'),
  ];

  // logos de rodapé
  const logosRodape = [
    {nome:'ICM',logo:SITE+'novo/parceiros/instituto-cultural-das-montanhas.png'},
  ];

  // quiz
  const abrev = n=>{ const p=String(n||'').trim().split(/\s+/); return p.length>1?p[0]+' '+p[p.length-1].charAt(0).toUpperCase()+'.':p[0]; };
  const fmtT = s=>{ s=Math.round(+s||0); return s?Math.floor(s/60)+'m'+String(s%60).padStart(2,'0')+'s':''; };
  const ranking = ((rk&&rk.ranking)||[]).map(r=>({nome:abrev(r.nome),pontos:Math.round(+r.pct||0),acertos:r.acertos||0,tempo:fmtT(r.tempo)}));
  const quiz = { atualizadoEm:'agora', totalParticipantes:ranking.length, chamada:'Jogue o quiz e entre no ranking!',
    link:'supercopaafc.com.br', premio:'O campeão será premiado na cerimônia de encerramento',
    qrcode:qr(APP+'#quiz'), ranking };

  // galera
  const fotos = ((gl&&gl.fotos)||[]).slice(0,20).map(f=>({url:f.f||'',nome:f.nome||'',legenda:f.cap||'Supercopa AFC'}));
  const galera = { chamada:'Poste sua foto e apareça no telão!', hashtag:'#SupercopaAFC', qrcode:qr(APP+'#fotos'),
    instrucao:'Abra o app da Supercopa e envie sua foto', fotos };

  // alerta manual via telaoAviso
  const alerta = (av&&av.aviso) ? { id:av.aviso.id||Date.now(), tipo:av.aviso.tipo||'texto', quadra:av.aviso.quadra||'', time:av.aviso.time||'', texto:av.aviso.texto||'' } : null;

  // encerramento (mata-mata → encerramento)
  const jm = id => jg.find(j=>String(j.id).toUpperCase()===id);
  const jFinal = jm('FINAL');
  const fimStatus = j => j && (j.status==='finalizado'||j.status==='wo');
  const encerramento = {
    edicao: t.edicao||'2024',
    final: jFinal ? { fase:'Grande final', data:String(jFinal.data||'').split('-').reverse().slice(0,2).join('/'),
      quadra:/altern/i.test(jFinal.quadra||'')?'Quadra alternativa':'Quadra principal',
      duracao:'', timeA:{nome:nome(jFinal,'c'),logo:logo(nome(jFinal,'c'))}, timeB:{nome:nome(jFinal,'v'),logo:logo(nome(jFinal,'v'))},
      setsA:jFinal.setsCasa||0, setsB:jFinal.setsVisitante||0, parciais:jFinal.parciais||[] } : {},
    podio: fimStatus(jFinal) ? [
      {posicao:1,nome:jFinal.vencedor||nome(jFinal,'c'),cidade:cid(jFinal.vencedor||nome(jFinal,'c')),logo:logo(jFinal.vencedor||nome(jFinal,'c'))},
    ] : [],
    campeao: fimStatus(jFinal) ? { nome:jFinal.vencedor||nome(jFinal,'c'), cidade:cid(jFinal.vencedor||nome(jFinal,'c')), logo:logo(jFinal.vencedor||nome(jFinal,'c')), fotoTime:'' } : {},

/* BroadcastChannel — recebe comandos do painel de controle */
(()=>{
  try{
    const bc = new BroadcastChannel('supercopa-telao');
    bc.onmessage = e=>{
      const cmd = e.data||{};
      if(cmd.type==='fase'){ try{ localStorage.setItem('sc-telao-fase',cmd.fase); }catch(_){} faseForcada=cmd.fase; fase=cmd.fase; cur=0; show(cur); }
      if(cmd.type==='tela'){ const k=playlist().indexOf(cmd.tela); if(k>=0){cur=k;paused=true;show(cur);} }
      if(cmd.type==='pausa'){ paused=cmd.val; }
      if(cmd.type==='avancar'){ show(cur+1); }
      if(cmd.type==='voltar'){ show(cur-1,-1); }
      if(cmd.type==='duracao'){ TELAS[cmd.tela]&&(TELAS[cmd.tela].dur=cmd.seg); }
      if(cmd.type==='ping'){ _bcSelf&&_bcSelf.postMessage({type:'estado',fase:fase||faseAtual(),tela:playlist()[cur],pausado:paused}); }
    };
    _bcSelf = bc;
    setInterval(()=>{ try{ bc.postMessage({type:'estado',fase:fase||'jogos',tela:(playlist&&playlist()[cur])||'',pausado:paused||false}); }catch(_){} }, 3000);
  }catch(_){}
})();

/* números contam de 0 até o valor quando a tela entra */
function countUp(root){
  root.querySelectorAll('[data-to]').forEach(el=>{
    const to = +el.dataset.to, ini = performance.now(), dur = 1300;
    if(!isFinite(to)) return;
    const step = now => { const k = Math.min(1,(now-ini)/dur), e = 1-Math.pow(1-k,4); el.textContent = Math.round(to*e); if(k<1) requestAnimationFrame(step); };

   ALERTAS EM TELA CHEIA (automáticos pelo placar + manuais pela planilha)
   ============================================================================= */
function analisarJogos(js, avisar){
  (js||[]).forEach(j=>{
    const k = j.quadra||'q', prev = ESTADO[k], melhorDe = j.melhorDe||CONFIG.melhorDe, setsW = Math.ceil(melhorDe/2);
    const parc = j.parciais||[], alvo = parc.length+1===melhorDe ? 15 : 25;
    const pa=j.pontosA??0, pb=j.pontosB??0, sa=j.setsA??0, sb=j.setsB??0;
    let cond=null, side=null;
    if(sa>=setsW||sb>=setsW){ cond='fimjogo'; side=sa>sb?'A':'B'; }
    else for(const sd of ['A','B']){ const me=sd==='A'?pa:pb, op=sd==='A'?pb:pa, ms=sd==='A'?sa:sb;
      if(me>=alvo-1 && me>op){ cond = ms===setsW-1?'matchpoint':'setpoint'; side=sd; } }
    let hist = prev ? prev.hist.slice() : [];
    if(prev && parc.length!==prev.nParc) hist = [];
    else if(prev){ for(let x=0;x<Math.max(0,pa-prev.pa);x++) hist.push('A'); for(let x=0;x<Math.max(0,pb-prev.pb);x++) hist.push('B'); }
    hist = hist.slice(-40);
    if(prev && avisar && CONFIG.alertasAutomaticos){
      const T = side==='A'?j.timeA:j.timeB;
      if(cond==='fimjogo' && prev.cond!=='fimjogo') alerta({tipo:'fimjogo',jogo:j,time:T,placar:`${sa} × ${sb}`,sub:'Placar em sets'});
      else if(parc.length>prev.nParc){ const u=parc[parc.length-1], w=u[0]>u[1]?'A':'B'; alerta({tipo:'fimset',jogo:j,time:w==='A'?j.timeA:j.timeB,placar:`${u[0]} × ${u[1]}`,sub:`${parc.length}º set`}); }
      else if(cond && cond!=='fimjogo' && (cond!==prev.cond||side!==prev.side)) alerta({tipo:cond,jogo:j,time:T,placar:`${pa} × ${pb}`});
    }
    ESTADO[k] = { cond, side, nParc:parc.length, pa, pb, hist };
  });
}

  const sw = $('#sweep'); sw.classList.remove('go'); void sw.offsetWidth; sw.classList.add('go');
  countUp(el);
  $('#stage').dataset.tela = id;
  $('#stage').classList.toggle('dark', ESCURAS.includes(id));
  if(DATA) renderFixos(DATA);   // troca a logo do cabeçalho (clara/escura) conforme o fundo
  $('#livePill').classList.toggle('on', fase==='jogos' && (DATA.jogosAoVivo||[]).length>0);
  t0 = performance.now(); buildOp();
}
function tick(now){
  const dur = durOverride ?? TELAS[playlist()[cur]].dur*1000;
  const el = paused ? 0 : (alertaOn ? alertaIni - t0 : now - t0);
  $('#progBar').style.width = (paused?0:Math.min(100, el/dur*100))+'%';
  if(!paused && !alertaOn && el >= dur) show(cur+1);
  requestAnimationFrame(tick);
}
function demoAlerta(k){
  const dj = (DATA && (DATA.jogosAoVivo||[])[0]) || {quadra:'Quadra Principal', timeA:{nome:'Time A'}, timeB:{nome:'Time B'}};
  const M = { setpoint:{tipo:'setpoint',jogo:dj,time:dj.timeA,placar:'24 × 22'}, matchpoint:{tipo:'matchpoint',jogo:dj,time:dj.timeA,placar:'24 × 21'},
    fimset:{tipo:'fimset',jogo:dj,time:dj.timeB,placar:'23 × 25',sub:'2º set'}, fimjogo:{tipo:'fimjogo',jogo:dj,time:dj.timeA,placar:'3 × 1',sub:'Placar em sets'},
    tempo:{tipo:'tempo',jogo:dj}, desafio:{tipo:'desafio',jogo:dj,time:dj.timeB} };
  if(M[k]) alerta(M[k]);
}
function clock(){
  const d = new Date();
  $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('#date').textContent = d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
  if(playlist()[cur]==='contagem') tickContagem(false);
}
function fit(){ $('#stage').style.transform = `scale(${Math.min(innerWidth/1920, innerHeight/960)})`; }
/* desenha as marcações dos dados (usa a posição real de cada elemento com data-slot) */
function desenharSlots(){
  if(!document.body.classList.contains('slots')) return;
  const st = $('#stage'), sr = st.getBoundingClientRect(), k = sr.width/1920, layer = $('#slotLayer');
  const els = [...st.querySelectorAll('[data-slot]')].filter(el=>{
    const sc = el.closest('.screen'); if(sc && !sc.classList.contains('active')) return false;
    if(el.closest('#op')) return false;
    const r = el.getBoundingClientRect(); return r.width>2 && r.height>2;
  });
  let n = 0, h = ''; const vistos = new Set();
  els.forEach(el=>{
    if(vistos.has(el.dataset.slot)) return; vistos.add(el.dataset.slot);   // não repete (ex.: logos duplicados do letreiro)
    const sr2 = el.getBoundingClientRect(); if(sr2.right < sr.left || sr2.left > sr.right) return;
    const r = el.getBoundingClientRect(), x=(r.left-sr.left)/k, y=(r.top-sr.top)/k, w=r.width/k, hh=r.height/k;
    n++; el.dataset.slotN = n;
    const fixo = !!el.closest('.hdr,.ftr');
    h += `<div data-fixo="${fixo?1:0}" class="bx ${y<24?'low':''}" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px"><div class="lb"><b>${n}</b><span>${esc(el.dataset.slot)}</span></div></div>`;
  });
  layer.innerHTML = h;
}
setInterval(desenharSlots, 600);
const FK = Object.keys(FASES);
addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(e.key==='ArrowRight') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1,-1);
  if(e.key===' '){ paused=!paused; t0=performance.now(); buildOp(); }
  if(k==='m') document.body.classList.toggle('slots');
  if(k==='f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if(/^[1-6]$/.test(e.key)){ faseForcada = FK[+e.key-1]; setFase(faseForcada); }
  if(e.key==='0'){ faseForcada = null; setFase(faseAtual()); }
  ({s:'setpoint',x:'matchpoint',e:'fimset',j:'fimjogo',t:'tempo',d:'desafio'})[k] && demoAlerta(({s:'setpoint',x:'matchpoint',e:'fimset',j:'fimjogo',t:'tempo',d:'desafio'})[k]);
});
let mt; addEventListener('mousemove',()=>{ document.body.classList.add('cursor'); clearTimeout(mt); mt=setTimeout(()=>document.body.classList.remove('cursor'),3500); });
function every(sec, tela, fn){ setInterval(()=>{ if(DATA && playlist()[cur]===tela && !alertaOn){ fn(); RENDER[tela](DATA); } }, sec*1000); }
async function atualizar(){
  try{
    DATA = await carregarDados(); renderFixos(DATA);
    analisarJogos(DATA.jogosAoVivo, faseAtual()==='jogos'); alertaManual(DATA);
    const f = faseAtual();
    if(f!==fase) setFase(f);
    else { const id = playlist()[cur]; if(['aovivo','classificacao','quiz'].includes(id)) RENDER[id](DATA); }   // atualiza só telas "ao vivo" (sem reiniciar animações das outras)
  }catch(err){ console.error('[Painel] falha ao carregar dados', err); }
}
window.addEventListener('load', async ()=>{
  fit(); addEventListener('resize', fit); $('#dust').innerHTML = dust();
  DATA = await carregarDados(); renderFixos(DATA); analisarJogos(DATA.jogosAoVivo,false); alertaManual(DATA);
  fase = faseAtual();
  const tu = params.get('tela');
  if(tu){ const k = playlist().indexOf(tu);
    if(k>=0){ cur=k; paused=true; } else { const fk = FK.find(x=>FASES[x].telas.includes(tu)); if(fk){ faseForcada=fk; fase=fk; cur=FASES[fk].telas.indexOf(tu); paused=true; } } }
  show(cur); clock(); setInterval(clock,1000);
  setInterval(atualizar, CONFIG.atualizarDadosACada*1000);
  every(CONFIG.equipeTrocaACada,'equipes',()=>teamIdx++);
  every(CONFIG.patrocinadorTrocaACada,'contagem',()=>{ sponsRotIdx++; msgIdx++; });
  every(CONFIG.mensagemTrocaACada,'boasvindas',()=>msgIdx++);
  every(CONFIG.fotoTrocaACada,'galera',()=>fanIdx++);
  requestAnimationFrame(tick);
});
