<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Overlay Vôlei — Supercopa AFC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;700&display=swap">
<style>
/* Placar ao vivo da Supercopa para transmissão (fundo transparente, 1920x1080).
   Parâmetros: ?estilo=classico|fino|minimo · ?escala=0.8 · ?quadra=principal|alternativa (pega o jogo ao vivo dessa quadra) · ?id=JOGO (fixa um jogo) · ?pos=baixo-esq|baixo-dir|topo-esq|topo-dir|topo-centro|baixo-centro · ?teste=1 (pega um jogo de teste da súmula em andamento) · ?demo=1 */
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;color:#fff}
#board{position:absolute;opacity:0;transform:translateY(24px);transition:opacity .5s,transform .5s}
#board.on{opacity:1;transform:none}
.cab{display:flex;align-items:center;gap:16px;height:62px;padding:0 24px 0 14px;background:#071a5c;border-top:4px solid #f5b800;color:#ffd34d;font-weight:800;font-size:26px;letter-spacing:2px;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);width:max-content}
.cab img{height:62px;margin:-8px 4px -8px 0;filter:drop-shadow(0 0 10px rgba(255,211,77,.55));animation:logoP 3.2s ease-in-out infinite}
@keyframes logoP{50%{transform:scale(1.07);filter:drop-shadow(0 0 18px rgba(255,211,77,.9))}}
.cab .set{background:#f5b800;color:#0b1a55;padding:2px 14px;font-size:24px}
.lin{display:grid;grid-template-columns:76px 420px 38px 74px 120px;align-items:stretch;height:84px;background:linear-gradient(90deg,#071a5c,#0b2a8f);border-bottom:2px solid rgba(255,255,255,.12)}
.lin:last-of-type{border-bottom:0}
.esc{display:flex;align-items:center;justify-content:center;background:#fff}
.esc img{max-width:60px;max-height:60px;object-fit:contain}
.esc b{color:#0b2a8f;font-size:34px}
.nm{display:flex;align-items:center;padding:0 18px;font-weight:800;font-size:46px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden}
.sv{display:flex;align-items:center;justify-content:center}
.sv i{width:20px;height:20px;border-radius:50%;background:#ffd34d;box-shadow:0 0 14px #ffd34d;opacity:0;transition:opacity .3s}
.sv i.on{opacity:1}
.st{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);font-size:50px;font-weight:800}
.pt{display:flex;align-items:center;justify-content:center;background:#fff;color:#0b2a8f;font-size:74px;font-weight:800;font-variant-numeric:tabular-nums}
.pt.flash{animation:fl .9s}
@keyframes fl{0%{background:#ffd34d;transform:scale(1.12)}100%{background:#fff;transform:none}}
.rod{display:flex;gap:22px;padding:0 20px;height:36px;align-items:center;background:rgba(7,26,92,.92);font-size:24px;font-weight:700;letter-spacing:1px;color:#cfe0ff;text-transform:uppercase;white-space:nowrap}
.rod span b{color:#fff}
.rod:empty{display:none}
.msg{position:absolute;left:0;top:0;color:#fff;font:700 28px 'Barlow',sans-serif;background:rgba(0,0,0,.6);padding:10px 16px}

/* animações quando o ponto muda */
.lin{position:relative}
.lin::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#ffd34d;transform:scaleX(0);transform-origin:left;pointer-events:none}
.lin.up::after{animation:barra 1.4s ease-out}
@keyframes barra{0%{transform:scaleX(0);opacity:1}30%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.pt.roll>span{display:inline-block;animation:roll .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes roll{0%{transform:translateY(-70%) scale(.7);opacity:0}60%{transform:translateY(8%) scale(1.25);opacity:1}100%{transform:none}}
.st.pop{animation:stpop .9s cubic-bezier(.2,1.5,.4,1)}
@keyframes stpop{0%{transform:scale(1);background:rgba(255,211,77,.9);color:#0b1a55}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.cab .set.chg{animation:setchg .8s}
@keyframes setchg{0%,100%{transform:none}30%{transform:scale(1.25) rotate(-2deg)}}
.sv i.on{animation:saque 1.4s ease-in-out infinite}
@keyframes saque{50%{transform:scale(1.35);box-shadow:0 0 22px #ffd34d}}
/* ---- entrada em cascata ao aparecer ---- */
#board.on .cab{animation:cabIn .7s cubic-bezier(.2,.9,.2,1) both}
#board.on .lin:nth-of-type(1){animation:linIn .7s cubic-bezier(.2,.9,.2,1) .12s both}
#board.on .lin:nth-of-type(2){animation:linIn .7s cubic-bezier(.2,.9,.2,1) .26s both}
#board.on .rod{animation:linIn .6s ease .4s both}
@keyframes cabIn{from{opacity:0;transform:translateX(-60px);clip-path:polygon(0 0,0 0,0 100%,0 100%)}}
@keyframes linIn{from{opacity:0;transform:translateX(-90px)}}
#board.on .esc img,#board.on .esc b{animation:escIn .8s cubic-bezier(.2,1.5,.4,1) .5s both}
@keyframes escIn{from{transform:scale(0) rotate(-120deg)}}
#board.on .nm{animation:nmIn .8s cubic-bezier(.2,.9,.2,1) .45s both}
@keyframes nmIn{from{opacity:0;letter-spacing:12px}}
/* brilho que passa pelas faixas */
.lin{overflow:hidden}
.lin::before{content:"";position:absolute;top:0;bottom:0;left:-30%;width:18%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);pointer-events:none;z-index:2;animation:shine 7s ease-in-out infinite 1.5s}
.lin:nth-of-type(2)::before{animation-delay:1.9s}
@keyframes shine{0%{left:-30%}22%,100%{left:130%}}
.cab{position:relative}
.cab::before{content:"";position:absolute;top:0;bottom:0;left:-30%;width:18%;background:linear-gradient(100deg,transparent,rgba(255,224,130,.4),transparent);transform:skewX(-20deg);animation:shine 7s ease-in-out infinite 1.2s}
/* ponto marcado: brilho dourado na faixa e no nome */
.lin.up{animation:glow 1.2s ease-out}
@keyframes glow{0%{box-shadow:inset 0 0 0 0 rgba(255,211,77,0)}20%{box-shadow:inset 0 0 70px 0 rgba(255,211,77,.65)}100%{box-shadow:inset 0 0 0 0 rgba(255,211,77,0)}}
.lin.up .nm{animation:nmhit 1s ease-out}
@keyframes nmhit{0%{color:#ffd34d;transform:translateX(10px)}100%{color:#fff;transform:none}}
.pt.flash::after{content:"";position:absolute;inset:0;border:4px solid #ffd34d;animation:anel .9s ease-out forwards;pointer-events:none}
.pt{position:relative}
@keyframes anel{from{opacity:1;transform:scale(.7)}to{opacity:0;transform:scale(1.35)}}
/* ponto de set / ponto do jogo */
.cab .sit{display:none;background:#e5484d;color:#fff;padding:2px 14px;font-size:22px;letter-spacing:3px;animation:sit 1s ease-in-out infinite}
.cab .sit.on{display:inline-block}
.cab .sit.jogo{background:#ffd34d;color:#0b1a55}
@keyframes sit{50%{opacity:.55;transform:scale(1.06)}}
/* faixa de destaque quando um set termina */
#ban{position:absolute;left:0;bottom:100%;margin-bottom:10px;white-space:nowrap;padding:8px 26px;background:linear-gradient(90deg,#f5b800,#ffd34d);color:#0b1a55;font-weight:800;font-size:34px;letter-spacing:3px;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);opacity:0;transform:translateX(-120%)}
#ban.on{animation:ban 4.5s cubic-bezier(.2,.9,.2,1) both}
@keyframes ban{0%{opacity:1;transform:translateX(-120%)}12%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-30%)}}
#board.topo #ban{bottom:auto;top:100%;margin:10px 0 0}
/* estilo FINO: uma faixa só, no topo ou embaixo */
#board.fino{display:flex;align-items:stretch}
#board.fino .cab{clip-path:none;height:auto;padding:0 18px;font-size:22px;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;border-top:0;border-left:5px solid #f5b800}
#board.fino .cab{display:grid;grid-template-columns:auto auto;column-gap:14px;row-gap:2px;align-content:center;justify-items:start}
#board.fino .cab img{height:100px;margin:0;grid-row:1/4}
#board.fino .lin{height:96px;border-bottom:0;border-left:2px solid rgba(255,255,255,.15);grid-template-columns:76px 330px 34px 70px 112px}
#board.fino .nm{font-size:40px}#board.fino .rod{display:none}
/* estilo MÍNIMO: só os dois times e os pontos */
#board.minimo .cab,#board.minimo .rod{display:none}
#board.minimo .lin{height:70px;grid-template-columns:64px 340px 34px 64px 100px}
#board.minimo .nm{font-size:38px}#board.minimo .pt{font-size:62px}
</style>
</head>
<body>
<div id="stage">
 <div id="board">
  <div class="cab"><img src="https://www.supercopaafc.com.br/novo/logo-branco.png" alt=""><span id="fase">Vôlei</span><span class="set" id="set">SET 1</span><span class="sit" id="sit"></span></div>
  <div class="lin"><div class="esc" id="eA"></div><div class="nm" id="nA"></div><div class="sv"><i id="sA"></i></div><div class="st" id="vA">0</div><div class="pt" id="pA">0</div></div>
  <div class="lin"><div class="esc" id="eB"></div><div class="nm" id="nB"></div><div class="sv"><i id="sB"></i></div><div class="st" id="vB">0</div><div class="pt" id="pB">0</div></div>
  <div class="rod" id="rod"></div>
  <div id="ban"></div>
 </div>
</div>
<script>
(function(){
var API='https://hngwasixgyvnvfanpuax.supabase.co/functions/v1/api',Q=new URLSearchParams(location.search);
var QUA=(Q.get('quadra')||'').toLowerCase(),QMAP={};var ID=Q.get('id'),POS=Q.get('pos')||'baixo-esq',DEMO=Q.has('demo'),$=function(i){return document.getElementById(i)};
var EST=(Q.get('estilo')||'classico').toLowerCase(),SC=parseFloat(Q.get('escala'))||1;
var stage=$('stage'),board=$('board'),ESC={},ult={},W=728,H=250;
if(EST!=='classico')board.classList.add(EST);board.style.transformOrigin='0 0';board.style.scale=String(SC);
function ajusta(){var s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+s+')'}
addEventListener('resize',ajusta);ajusta();
function posiciona(){var bw=board.offsetWidth,bh=board.offsetHeight;if(bw)W=bw*SC;if(bh)H=bh*SC;var m=60,p=POS.split('-'),v=p[0],h=p[1]||'esq';board.style.top=board.style.bottom=board.style.left=board.style.right='';
 if(v==='topo')board.style.top=m+'px';else board.style.top=(1080-m-H)+'px';
 if(h==='esq')board.style.left=m+'px';else if(h==='dir')board.style.left=(1920-m-W)+'px';else board.style.left=((1920-W)/2)+'px'}
posiciona();
var get=function(a,p){var q=new URLSearchParams(Object.assign({action:a},p||{}));return fetch(API+'?'+q,{cache:'no-store'}).then(function(r){return r.json()})};
function escudos(){return get('timesPublicos').then(function(r){(r.times||[]).forEach(function(t){ESC[String(t.nome).toLowerCase()]=t.escudo})}).catch(function(){})}
function logo(el,nome){var u=ESC[String(nome).toLowerCase()],k=el.dataset.n;if(k===nome)return;el.dataset.n=nome;
 var ini=String(nome).trim().charAt(0).toUpperCase();el.innerHTML='<b>'+ini+'</b>';
 if(u){var im=new Image();im.onload=function(){el.innerHTML='';el.appendChild(im)};im.src=u}}
function set(id,v,flash){var e=$(id),t=String(v);if(e.textContent!==t&&e.dataset.v!==t){var prim=e.dataset.v===undefined;e.dataset.v=t;
  if(id==='pA'||id==='pB'){e.innerHTML='<span>'+t+'</span>';if(!prim&&flash){e.classList.remove('flash','roll');void e.offsetWidth;e.classList.add('flash','roll');var l=e.closest('.lin');l.classList.remove('up');void l.offsetWidth;l.classList.add('up')}}
  else{e.textContent=t;if(!prim){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}}}}
function aviso(on){var m=$('aviso');if(!m){m=document.createElement('div');m.id='aviso';m.style.cssText='position:absolute;left:60px;top:60px;padding:12px 18px;background:rgba(7,26,92,.85);color:#fff;font:700 26px Barlow,sans-serif;letter-spacing:1px;border-left:6px solid #f5b800';m.textContent='Aguardando jogo em andamento na súmula…';stage.appendChild(m)}m.style.display=on?'block':'none'}
function mostra(e){
 if(!e){board.classList.remove('on');if(Q.has('teste')||Q.has('aguarde'))aviso(true);return}
 if(Q.has('teste')||Q.has('aguarde'))aviso(false);
 $('nA').textContent=e.equipeCasa;$('nB').textContent=e.equipeVisitante;logo($('eA'),e.equipeCasa);logo($('eB'),e.equipeVisitante);
 var fim=e.status==='finalizada';
 var stx=fim?'FIM DE JOGO':'SET '+(e.setAtual||1);if($('set').textContent!==stx){$('set').textContent=stx;var sl=$('set');sl.classList.remove('chg');void sl.offsetWidth;sl.classList.add('chg')}
 set('pA',e.pontosCasa||0,true);set('pB',e.pontosVisitante||0,true);set('vA',e.setsCasa||0);set('vB',e.setsVisitante||0);
 $('sA').className=!fim&&e.sacando==='A'?'on':'';$('sB').className=!fim&&e.sacando==='B'?'on':'';
 var hs=(e.historicoSets||[]);$('rod').innerHTML=hs.map(function(s,i){return '<span>'+(i+1)+'º set <b>'+s.a+' x '+s.b+'</b></span>'}).join('');
 // ponto de set / ponto do jogo (set decisivo = 3º, vai a 15; diferença de 2)
 var alvo=(e.setAtual===3)?15:25,pa=e.pontosCasa||0,pb=e.pontosVisitante||0,lid=pa>pb?'A':pb>pa?'B':'',mx=Math.max(pa,pb),sit='',jogo=false;
 if(!fim&&lid&&mx>=alvo-1&&mx>Math.min(pa,pb)){sit='PONTO DE SET';if((lid==='A'?e.setsCasa:e.setsVisitante)>=1){sit='PONTO DO JOGO';jogo=true}}
 var se=$('sit');se.textContent=sit;se.classList.toggle('on',!!sit);se.classList.toggle('jogo',jogo);
 // faixa quando um set é fechado (só depois do primeiro carregamento)
 var sc=(e.setsCasa||0),sv=(e.setsVisitante||0);
 if(ult.sc!==undefined&&(sc>ult.sc||sv>ult.sv)){var ban=$('ban');ban.textContent=fim?'Fim de jogo · '+(sc>sv?e.equipeCasa:e.equipeVisitante):'Set para '+(sc>ult.sc?e.equipeCasa:e.equipeVisitante);ban.classList.remove('on');void ban.offsetWidth;ban.classList.add('on')}
 ult.sc=sc;ult.sv=sv;
 board.classList.toggle('topo',POS.indexOf('topo')===0);
 board.classList.add('on');posiciona();
}
function quadras(){return get('torneio',{modalidade:'volei'}).then(function(t){(t.jogos||[]).forEach(function(j){QMAP[String(j.id).toUpperCase()]=String(j.quadra||'').toLowerCase()})}).catch(function(){})}
function escolhe(lista){ // jogo em andamento (filtra pela quadra, se ?quadra=principal|alternativa)
 var l=(lista||[]).filter(function(p){return p.status==='em_andamento'||p.status==='sets_completos'});
 if(QUA)l=l.filter(function(p){return (QMAP[String(p.id).toUpperCase()]||'').indexOf(QUA)>=0});
 l.sort(function(a,b){return String(b.atualizadoEm||'')>String(a.atualizadoEm||'')?1:-1});return l[0]&&l[0].id}
var DEMO_E=[{equipeCasa:'Alpha Vôlei',equipeVisitante:'CT das Montanhas',setAtual:2,pontosCasa:21,pontosVisitante:19,setsCasa:1,setsVisitante:0,sacando:'A',historicoSets:[{a:25,b:21}],status:'em_andamento'}];
function testeAoVivo(){ // jogos de teste da súmula não entram na lista ao vivo: procura TESTE1..TESTE4
 var ids=['TESTE1','TESTE2','TESTE3','TESTE4'];
 return Promise.all(ids.map(function(i){return get('partida',{id:i}).then(function(r){return r&&r.ok&&r.estado&&r.estado.status==='em_andamento'?i:null}).catch(function(){return null})})).then(function(l){return l.filter(Boolean)[0]})}
function ciclo(){
 if(DEMO){var e=DEMO_E[0],r=Math.random()<.55;if(r)e.pontosCasa++;else e.pontosVisitante++;e.sacando=r?'A':'B';
  var al=e.setAtual===3?15:25,m=Math.max(e.pontosCasa,e.pontosVisitante);
  if(m>=al&&Math.abs(e.pontosCasa-e.pontosVisitante)>=2){if(e.pontosCasa>e.pontosVisitante)e.setsCasa++;else e.setsVisitante++;e.historicoSets.push({a:e.pontosCasa,b:e.pontosVisitante});e.pontosCasa=e.pontosVisitante=0;e.setAtual++;if(e.setsCasa>=2||e.setsVisitante>=2){e.status='finalizada'}}
  if(e.status==='finalizada'&&!DEMO_E.f){DEMO_E.f=Date.now()}else if(DEMO_E.f&&Date.now()-DEMO_E.f>8000){DEMO_E[0]={equipeCasa:'Alpha Vôlei',equipeVisitante:'CT das Montanhas',setAtual:1,pontosCasa:18,pontosVisitante:20,setsCasa:0,setsVisitante:0,sacando:'A',historicoSets:[],status:'em_andamento'};DEMO_E.f=0}
  return mostra(e)}
 var p=ID?Promise.resolve(ID):Q.has('teste')?testeAoVivo():get('partidasAoVivo').then(function(r){return escolhe(r.partidas)});
 return p.then(function(id){if(!id)return mostra(null);return get('partida',{id:id}).then(function(r){mostra(r&&r.ok?r.estado:null)})}).catch(function(){})
}
escudos().then(function(){return QUA?quadras():0}).then(function(){ciclo();setInterval(ciclo,2000);if(QUA)setInterval(quadras,60000)});
setInterval(escudos,600000);
})();
</script>
</body>
</html>
