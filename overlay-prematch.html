<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pré-Jogo · Supercopa AFC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,900&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}

/* ── stage 1920×1080, escala pelo JS ── */
#stage{
  position:absolute;left:0;top:0;
  width:1920px;height:1080px;
  transform-origin:0 0;
  font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  color:#fff;
  opacity:0;
  animation:stageIn .5s .1s forwards;
}
@keyframes stageIn{to{opacity:1}}

/* ═══════════ TOPBAR ═══════════ */
#topbar{
  position:absolute;left:0;right:0;top:0;height:76px;
  background:linear-gradient(90deg,#061640 0%,#0b2a8f 50%,#061640 100%);
  border-bottom:4px solid #f5b800;
  display:flex;align-items:center;justify-content:center;gap:28px;
  z-index:30;
  animation:slideDown .5s both;
}
@keyframes slideDown{from{transform:translateY(-76px)}to{transform:none}}
.top-title{font-size:24px;font-weight:900;letter-spacing:5px;color:#ffd34d;text-transform:uppercase}
.top-sep{width:2px;height:26px;background:rgba(245,184,0,.4)}
.top-sub{font-size:16px;font-weight:700;letter-spacing:4px;color:#a0b8e8;text-transform:uppercase}

/* ═══════════ BOTBAR ═══════════ */
#botbar{
  position:absolute;left:0;right:0;bottom:0;height:92px;
  background:linear-gradient(90deg,#061640 0%,#07122e 50%,#061640 100%);
  border-top:4px solid #f5b800;
  display:flex;align-items:center;justify-content:center;
  z-index:30;
  animation:slideUp .5s both;
}
@keyframes slideUp{from{transform:translateY(92px)}to{transform:none}}
.info-block{
  display:flex;align-items:center;gap:14px;
  padding:0 44px;
  border-right:1px solid rgba(245,184,0,.2);
}
.info-block:last-child{border:none}
.info-icon{font-size:28px;opacity:.7}
.info-label{font-size:12px;font-weight:700;letter-spacing:4px;color:#6880b8;text-transform:uppercase}
.info-val{font-size:30px;font-weight:900;letter-spacing:1px;text-transform:uppercase}

/* ═══════════ PAINÉIS LATERAIS ═══════════ */
/* Area principal: de y=76 até y=988 → 912px de altura */

#panel-casa{
  position:absolute;left:0;top:76px;
  width:790px;bottom:92px;
  overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:28px;
}
.bg-casa{
  position:absolute;inset:0;
  background:linear-gradient(130deg,#1b52e0 0%,#0b2a8f 45%,#071a5c 100%);
}

#panel-vis{
  position:absolute;right:0;top:76px;
  width:790px;bottom:92px;
  overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:28px;
}
.bg-vis{
  position:absolute;inset:0;
  background:linear-gradient(230deg,#c01010 0%,#7a0808 45%,#3a0101 100%);
}

/* padrão de linhas diagonais nos painéis */
.diags{
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    -58deg,
    transparent 0,transparent 44px,
    rgba(255,255,255,.028) 44px,rgba(255,255,255,.028) 46px
  );
}

/* cantos angulares dourados */
.corner-tl{
  position:absolute;top:0;left:0;
  width:0;height:0;
  border-style:solid;
  border-width:120px 120px 0 0;
  border-color:rgba(245,184,0,.14) transparent transparent transparent;
}
.corner-br{
  position:absolute;bottom:0;right:0;
  width:0;height:0;
  border-style:solid;
  border-width:0 0 100px 100px;
  border-color:transparent transparent rgba(245,184,0,.08) transparent;
}

/* borda vertical dourada entre painel e centro */
.panel-edge{
  position:absolute;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,transparent,#f5b800 15%,#f5b800 85%,transparent);
  box-shadow:0 0 14px 2px rgba(245,184,0,.45);
}
#panel-casa .panel-edge{right:0}
#panel-vis .panel-edge{left:0}

/* ═══════════ BADGE ═══════════ */
.badge-wrap{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:center;
  animation:badgeIn .7s .35s both;
}
@keyframes badgeIn{from{opacity:0;transform:scale(.55) translateY(-16px)}to{opacity:1;transform:scale(1) translateY(0)}}
.badge-glow{
  position:absolute;
  width:290px;height:290px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(245,184,0,.2) 0%,transparent 68%);
  pointer-events:none;
}
.badge-ring{
  position:absolute;
  width:248px;height:248px;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,.12);
  pointer-events:none;
}
.badge-img{
  width:220px;height:220px;
  object-fit:contain;
  filter:drop-shadow(0 8px 36px rgba(0,0,0,.85));
  position:relative;z-index:1;
}
.badge-init{
  width:220px;height:220px;
  border-radius:50%;
  background:rgba(0,0,0,.35);
  border:3px solid rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:68px;font-weight:900;
  letter-spacing:1px;
  backdrop-filter:blur(6px);
  position:relative;z-index:1;
}

/* ═══════════ NOME DO TIME ═══════════ */
.team-name{
  position:relative;z-index:2;
  font-weight:900;text-transform:uppercase;
  line-height:.88;letter-spacing:2px;
  text-align:center;
  text-shadow:0 4px 20px rgba(0,0,0,.8),0 0 48px rgba(0,0,0,.5);
  padding:0 48px;
  width:100%;
  animation:nameIn .6s .5s both;
}
@keyframes nameIn{from{opacity:0;letter-spacing:14px}to{opacity:1;letter-spacing:2px}}

/* ═══════════ CENTRO ═══════════ */
#center{
  position:absolute;
  left:790px;right:790px;
  top:76px;bottom:92px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
  z-index:20;
}
#center-bg{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#0d1326 0%,#080d1a 100%);
}

#date-chip{
  position:absolute;top:24px;
  background:#f5b800;color:#050d1a;
  font-size:36px;font-weight:900;letter-spacing:2px;
  padding:8px 32px;
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);
  white-space:nowrap;
  z-index:2;
  animation:chipIn .5s .6s both;
}
@keyframes chipIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}

#vs{
  position:relative;z-index:2;
  font-size:176px;font-weight:900;font-style:italic;
  line-height:.85;letter-spacing:-4px;
  background:linear-gradient(160deg,#ffffff 0%,#c0d4ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 32px rgba(27,82,224,.45));
  animation:vsIn .5s .25s both;
}
@keyframes vsIn{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}

.ctr-line{
  width:72px;height:3px;
  background:linear-gradient(90deg,transparent,#f5b800,transparent);
  margin:18px 0;
  position:relative;z-index:2;
}

#sc-logo{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:chipIn .5s .8s both;
}
#sc-logo img{
  height:60px;
  filter:drop-shadow(0 0 10px rgba(245,184,0,.5));
}
#sc-logo-name{font-size:14px;font-weight:800;letter-spacing:5px;color:#ffd34d;text-transform:uppercase}

#fase-bottom{
  position:absolute;bottom:16px;z-index:2;
  font-size:13px;font-weight:700;letter-spacing:3px;color:#6880b8;text-transform:uppercase;
  text-align:center;padding:0 8px;width:100%;
}

/* glow de atmosfera no centro */
#center-glow{
  position:absolute;
  left:50%;top:50%;
  width:320px;height:320px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(27,82,224,.22) 0%,transparent 70%);
  pointer-events:none;z-index:1;
}
</style>
</head>
<body>
<div id="stage">

  <!-- topo -->
  <div id="topbar">
    <span class="top-title">Supercopa AFC</span>
    <div class="top-sep"></div>
    <span class="top-sub" id="top-fase">Copa de Vôlei</span>
  </div>

  <!-- painel casa -->
  <div id="panel-casa">
    <div class="bg-casa"></div>
    <div class="diags"></div>
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="panel-edge"></div>
    <div class="badge-wrap">
      <div class="badge-glow"></div>
      <div class="badge-ring"></div>
      <img class="badge-img" id="shield-casa" src="" style="display:none" alt="">
      <div class="badge-init" id="init-casa"></div>
    </div>
    <div class="team-name" id="name-casa">TIME A</div>
  </div>

  <!-- painel visitante -->
  <div id="panel-vis">
    <div class="bg-vis"></div>
    <div class="diags"></div>
    <div class="corner-tl" style="transform:scaleX(-1)"></div>
    <div class="corner-br" style="transform:scaleX(-1)"></div>
    <div class="panel-edge"></div>
    <div class="badge-wrap">
      <div class="badge-glow"></div>
      <div class="badge-ring"></div>
      <img class="badge-img" id="shield-vis" src="" style="display:none" alt="">
      <div class="badge-init" id="init-vis"></div>
    </div>
    <div class="team-name" id="name-vis">TIME B</div>
  </div>

  <!-- centro -->
  <div id="center">
    <div id="center-bg"></div>
    <div id="center-glow"></div>
    <div id="date-chip" style="display:none"></div>
    <div id="vs">VS</div>
    <div class="ctr-line"></div>
    <div id="sc-logo">
      <img src="logo-supercopa.jpg" alt="Supercopa AFC" onerror="this.style.display='none'">
      <div id="sc-logo-name">Supercopa AFC</div>
    </div>
    <div id="fase-bottom"></div>
  </div>

  <!-- rodapé -->
  <div id="botbar">
    <div class="info-block" id="blk-data" style="display:none">
      <span class="info-icon">📅</span>
      <div><div class="info-label">Data</div><div class="info-val" id="bot-data"></div></div>
    </div>
    <div class="info-block" id="blk-quadra" style="display:none">
      <span class="info-icon">🏟</span>
      <div><div class="info-label">Local</div><div class="info-val" id="bot-quadra"></div></div>
    </div>
    <div class="info-block" id="blk-horario" style="display:none">
      <span class="info-icon">🕐</span>
      <div><div class="info-label">Horário</div><div class="info-val" id="bot-horario"></div></div>
    </div>
    <div class="info-block" id="blk-grupo" style="display:none">
      <span class="info-icon">🏐</span>
      <div><div class="info-label">Grupo</div><div class="info-val" id="bot-grupo"></div></div>
    </div>
  </div>

</div>
<script>
const SC_API='https://hngwasixgyvnvfanpuax.supabase.co/functions/v1/api';
function p(k){return new URLSearchParams(location.search).get(k)||''}
function initials(n){return n.trim().split(/\s+/).map(function(w){return w[0]||''}).slice(0,3).join('').toUpperCase()}

// escala stage para o viewport
(function(){
  var W=1920,H=1080,st=document.getElementById('stage');
  function resize(){
    var s=Math.min(innerWidth/W,innerHeight/H);
    st.style.transform='scale('+s+')';
    st.style.left=Math.round((innerWidth-W*s)/2)+'px';
    st.style.top=Math.round((innerHeight-H*s)/2)+'px';
  }
  resize();window.addEventListener('resize',resize);
})();

function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v}
function show(id){var e=document.getElementById(id);if(e)e.style.display=''}
function hide(id){var e=document.getElementById(id);if(e)e.style.display='none'}

// ajusta font-size para caber no painel (790px - 96px padding = 694px útil)
// Barlow Condensed: char width ≈ 0.52 × fontSize (conservador)
function scaleName(id,name){
  var el=document.getElementById(id);if(!el)return;
  var usable=694,len=name.length,size=140;
  while(size>36&&len*size*0.52>usable)size-=4;
  el.style.fontSize=size+'px';
}

function shield(imgId,initId,url){
  var img=document.getElementById(imgId);
  img.onload=function(){img.style.display='block';hide(initId)};
  img.onerror=function(){img.style.display='none';show(initId)};
  img.src=url;
}

function applyParams(){
  var casa=p('casa')||'TIME A';
  var vis=p('visitante')||'TIME B';
  var data=p('data'),horario=p('horario'),quadra=p('quadra'),grupo=p('grupo'),fase=p('fase');
  var escCasa=p('escudo_casa'),escVis=p('escudo_vis');

  set('name-casa',casa); scaleName('name-casa',casa);
  set('name-vis',vis);   scaleName('name-vis',vis);
  set('init-casa',initials(casa));
  set('init-vis',initials(vis));

  if(data){set('date-chip',data);show('date-chip');set('bot-data',data);show('blk-data')}
  if(horario){set('bot-horario',horario);show('blk-horario')}
  if(quadra){set('bot-quadra',quadra);show('blk-quadra')}
  if(grupo){set('bot-grupo','Grupo '+grupo);show('blk-grupo')}

  var faseMap={grupos:'Fase de Grupos',quartas:'Quartas de Final',semifinal:'Semifinal',final:'Grande Final'};
  var fl=faseMap[fase]||(grupo?'Grupo '+grupo+' · Fase de Grupos':'Copa de Vôlei');
  set('top-fase',fl);set('fase-bottom',fl);

  if(escCasa)shield('shield-casa','init-casa',escCasa);
  if(escVis) shield('shield-vis','init-vis',escVis);
  if(!escCasa||!escVis)fetchShields(casa,vis,escCasa,escVis);
}

async function fetchShields(cN,vN,eC,eV){
  try{
    var r=await fetch(SC_API+'?action=timesPublicos',{signal:AbortSignal.timeout(6000)});
    var d=await r.json();
    var times=d.times||[];
    var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()};
    var find=function(n){return times.find(function(t){return norm(t.nome)===norm(n)})};
    function apply(nome,imgId,initId,ov){
      if(ov)return;
      var t=find(nome);if(!t||!t.escudo)return;
      var url=t.escudo.startsWith('http')?t.escudo:'https://hngwasixgyvnvfanpuax.supabase.co/storage/v1/object/public/'+t.escudo;
      var img=document.getElementById(imgId);
      img.onload=function(){img.style.display='block';hide(initId)};
      img.src=url;
    }
    apply(cN,'shield-casa','init-casa',eC);
    apply(vN,'shield-vis','init-vis',eV);
  }catch(e){}
}

applyParams();
</script>
</body>
</html>
