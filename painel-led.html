<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel de LED — Supercopa AFC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
/* Painel de LED do ginásio (1920x1080), no mesmo visual do site e do app da Supercopa.
   Parâmetros: ?tempo=14 (segundos por tela) · ?demo=1 (dados de exemplo) · ?cena=live|prox|class|patro (fixa uma tela) */
:root{--b1:#1b52e0;--b2:#0b2a8f;--b3:#071a5c;--ink:#0a1640;--gold:#ffd34d;--display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Barlow','Helvetica Neue',Arial,sans-serif}
html,body{margin:0;height:100%;background:#071a5c;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:#fff;font-family:var(--display);overflow:hidden;
 background:linear-gradient(160deg,#1b52e0,#0b2a8f 62%,#071a5c)}
#stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px}
#top{position:absolute;left:0;right:0;top:0;height:132px;display:flex;align-items:center;gap:34px;padding:0 64px}
#top img{height:96px}
#top .tt{flex:1;min-width:0}
#top .tt small{display:block;font:700 26px var(--body);letter-spacing:7px;text-transform:uppercase;color:var(--gold)}
#top .tt h1{margin:2px 0 0;font:800 82px/.95 var(--display);text-transform:uppercase;letter-spacing:1px}
#top .rel{font:800 84px/1 var(--display);letter-spacing:2px;font-variant-numeric:tabular-nums}
#top .live{display:none;align-items:center;gap:14px;padding:10px 28px;background:#e5484d;font:800 44px/1 var(--display);letter-spacing:3px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
#top .live.on{display:flex}#top .live i{width:20px;height:20px;border-radius:50%;background:#fff;animation:pisca 1s steps(2) infinite}
@keyframes pisca{50%{opacity:.2}}
#cena{position:absolute;left:0;right:0;top:140px;bottom:78px;overflow:hidden}
.sc{position:absolute;inset:0;padding:10px 64px 14px;opacity:0;transform:translateY(40px);transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.2,1)}
.sc.on{opacity:1;transform:none}.sc.sai{opacity:0;transform:translateY(-40px)}
#rodape{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;align-items:center;gap:18px;padding:0 64px;background:rgba(7,26,92,.92);border-top:4px solid var(--gold);font:700 34px var(--body);letter-spacing:3px;text-transform:uppercase;color:#cfe0ff;white-space:nowrap}
#rodape b{color:#fff}#bolas{margin-left:auto;display:flex;gap:12px}#bolas i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.28)}#bolas i.on{background:var(--gold)}
/* escudos */
.sh{flex:none;display:grid;place-items:center;width:var(--s,110px);height:var(--s,110px);background:#fff;border-radius:calc(var(--s,110px)*.22);overflow:hidden}
.sh img{width:84%;height:84%;object-fit:contain}.sh b{font:800 calc(var(--s,110px)*.5) var(--display);color:var(--b1)}
/* faixa de jogo (igual às faixas do site e do app) */
.fx{position:relative;color:#fff;background:linear-gradient(100deg,#0b2a8f,#1b52e0 55%,#0b2a8f);clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);overflow:hidden;border-top:5px solid #4d8bff}
.fx::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.055) 0 9px,transparent 9px 20px);pointer-events:none}
.fx>*{position:relative}
.fx.alt{background:#eef3ff;color:var(--ink);border-top-color:#c8d6f8}.fx.alt::before{background:repeating-linear-gradient(115deg,rgba(27,82,224,.05) 0 9px,transparent 9px 20px)}
/* AO VIVO */
.quadras{display:grid;grid-template-columns:1fr 1fr;gap:36px;height:100%}
.qd{display:flex;flex-direction:column;gap:12px;min-width:0}
.qd .tt{display:flex;justify-content:space-between;align-items:baseline;font:700 34px var(--body);letter-spacing:6px;text-transform:uppercase;color:var(--gold)}
.qd .tt span{color:#fff;font:800 54px var(--display);letter-spacing:2px}
.eq{flex:1;display:grid;grid-template-columns:130px 1fr 110px 250px;align-items:center;gap:14px;padding:0 0 0 20px;min-height:0}
.eq .n{display:flex;align-items:center;gap:16px;font:800 76px/.95 var(--display);text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.eq .n i{width:26px;height:26px;border-radius:50%;background:var(--gold);flex:none;opacity:0}.eq .n i.on{opacity:1;animation:pisca 1s steps(2) infinite}
.eq .s{font:800 100px/1 var(--display);text-align:center;color:var(--gold)}
.eq .p{height:100%;display:grid;place-items:center;background:#fff;color:var(--b2);font:800 190px/1 var(--display);font-variant-numeric:tabular-nums}
.qd .ft{font:700 38px var(--body);letter-spacing:3px;text-transform:uppercase;color:#cfe0ff;padding:4px 6px}
.qd.vazia{justify-content:center}
.vz{flex:1;display:grid;place-items:center;text-align:center;padding:0 30px;font:800 72px/1.05 var(--display);text-transform:uppercase;color:#cfe0ff}
.vz b{display:block;color:#fff;font-size:88px;margin-top:18px}.vz em{font-style:normal;color:var(--gold)}
/* PRÓXIMOS JOGOS */
.lista{display:flex;flex-direction:column;gap:14px;height:100%}
.jg{flex:1;display:grid;grid-template-columns:270px 1fr;align-items:center;min-height:0}
.jg .h{font:800 96px/1 var(--display);padding-left:34px;font-variant-numeric:tabular-nums;color:var(--gold)}
.jg.alt .h{color:var(--b1)}
.jg .m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px;padding-right:30px}
.jg .t{display:flex;align-items:center;gap:20px;font:800 64px/1 var(--display);text-transform:uppercase;min-width:0}
.jg .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg .t:last-child{flex-direction:row-reverse;text-align:right}
.jg .x{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:190px}
.jg .x em{font:800 40px var(--display);font-style:normal;opacity:.8}.jg .x small{font:700 28px var(--body);letter-spacing:3px;text-transform:uppercase;opacity:.85}
/* CLASSIFICAÇÃO */
.grupos{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:26px;height:100%}
.gr{display:flex;flex-direction:column;gap:8px;min-width:0}
.gr .gt{font:700 32px var(--body);letter-spacing:6px;text-transform:uppercase;color:var(--gold)}.gr .gt b{color:#fff;font:800 50px var(--display);letter-spacing:2px;margin-left:12px}
.gr .li{flex:1;display:grid;grid-template-columns:80px 70px 1fr 110px;align-items:center;gap:12px;padding:0 24px 0 18px;min-height:0;font:800 54px/1 var(--display);text-transform:uppercase;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.gr .li{background:#0b2a8f;border-top:4px solid #4d8bff}.gr .li.alt{background:#eef3ff;color:var(--ink);border-top-color:#c8d6f8}
.gr .li b{color:var(--gold)}.gr .li.alt b{color:var(--b1)}.gr .li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gr .li u{text-decoration:none;text-align:right;font-size:64px}
/* PATROCINADORES */
.pt{height:100%;display:flex;flex-direction:column}
.pt .ct{font:700 36px var(--body);letter-spacing:8px;text-transform:uppercase;color:var(--gold)}.pt .ct b{display:block;margin-top:4px;color:#fff;font:800 96px/1 var(--display);letter-spacing:2px}
.pt .lg{flex:1;display:flex;flex-wrap:wrap;gap:26px;align-content:center;justify-content:center}
.pt .lg div{background:#fff;width:var(--w,520px);height:var(--h,300px);display:grid;place-items:center;padding:20px;border-radius:26px;box-shadow:0 18px 40px rgba(5,10,40,.35)}
.pt .lg img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="stage">
 <div id="top"><img src="https://www.supercopaafc.com.br/novo/logo-branco.png" alt=""><div class="tt"><small>Supercopa AFC · Vôlei 2026</small><h1 id="titulo">Supercopa</h1></div><div class="live" id="live"><i></i>AO VIVO</div><div class="rel" id="rel">--:--</div></div>
 <div id="cena"></div>
 <div id="rodape"><span><b>supercopaafc.com.br</b> · Afonso Cláudio / ES · 28 e 29 de novembro</span><div id="bolas"></div></div>
</div>
<script>
(function(){
var API='https://hngwasixgyvnvfanpuax.supabase.co/functions/v1/api',Q=new URLSearchParams(location.search),DEMO=Q.has('demo'),TEMPO=Math.max(5,parseFloat(Q.get('tempo'))||14),FIXA=Q.get('cena');
var BASE='https://www.supercopaafc.com.br/novo/parceiros/',$=function(i){return document.getElementById(i)},stage=$('stage'),ESC={};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function ajusta(){var s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+s+')';stage.style.left=((innerWidth-1920*s)/2)+'px';stage.style.top=((innerHeight-1080*s)/2)+'px'}
addEventListener('resize',ajusta);ajusta();
function relogio(){var d=new Date();$('rel').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}setInterval(relogio,15000);relogio();
var get=function(a,p){var q=new URLSearchParams(Object.assign({action:a},p||{}));return fetch(API+'?'+q,{cache:'no-store'}).then(function(r){return r.json()})};
var ek=function(n){return String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()};
var SH=function(nome,s){var u=ESC[ek(nome)],ini=esc(String(nome||'?').charAt(0).toUpperCase());return '<span class="sh" style="--s:'+(s||110)+'px">'+(u?'<img src="'+esc(u)+'" alt="" onerror="this.parentNode.innerHTML=\'<b>'+ini+'</b>\'">':'<b>'+ini+'</b>')+'</span>'};
function escudos(){if(DEMO)return Promise.resolve();return get('timesPublicos').then(function(r){(r.times||[]).forEach(function(t){var u=t.escudo||'';if(/^uni[aã]o v[oô]lei$/i.test(t.nome))u='https://www.supercopaafc.com.br/novo/escudos/uniao-volei.png';if(/^ct das montanhas$/i.test(t.nome))u='https://www.supercopaafc.com.br/novo/escudos/ct-das-montanhas.png';if(u)ESC[ek(t.nome)]=u})}).catch(function(){})}
var T={jogos:[],grupos:[]},AO=[],QMAP={};
var DEMO_T={jogos:[
 {id:'A1',fase:'grupos',grupo:'A',casa:'ES VÔLEI',visitante:'CTV Aravôlei',casaDefinida:true,visitanteDefinida:true,data:'2026-11-28',hora:'13:00',quadra:'Quadra principal - Eurico Vieira',status:'ao_vivo'},
 {id:'C3',fase:'grupos',grupo:'C',casa:'Supra Vôlei',visitante:'MS Vôlei',casaDefinida:true,visitanteDefinida:true,data:'2026-11-28',hora:'13:00',quadra:'Quadra alternativa - Anadir Barone',status:'ao_vivo'},
 {id:'B1',fase:'grupos',grupo:'B',casa:'Equipe UVI',visitante:'CTVA Voleibol',casaDefinida:true,visitanteDefinida:true,data:'2026-11-28',hora:'14:15',quadra:'Quadra principal - Eurico Vieira',status:'agendado'},
 {id:'D1',fase:'grupos',grupo:'D',casa:'RPB Volei',visitante:'Alpha Vôlei',casaDefinida:true,visitanteDefinida:true,data:'2026-11-28',hora:'14:15',quadra:'Quadra alternativa - Anadir Barone',status:'agendado'},
 {id:'C2',fase:'grupos',grupo:'C',casa:'CT das Montanhas',visitante:'MS Vôlei',casaDefinida:true,visitanteDefinida:true,data:'2026-11-28',hora:'15:30',quadra:'Quadra principal - Eurico Vieira',status:'agendado'},
 {id:'A3',fase:'grupos',grupo:'A',casa:'CTV Aravôlei',visitante:'União vôlei',casaDefinida:true,visitanteDefinida:true,data:'2026-11-28',hora:'15:30',quadra:'Quadra alternativa - Anadir Barone',status:'agendado'},
 {id:'D2',fase:'grupos',grupo:'D',casa:'RPB Volei',visitante:'Super Vôlei',casaDefinida:true,visitanteDefinida:true,data:'2026-11-28',hora:'16:45',quadra:'Quadra principal - Eurico Vieira',status:'agendado'}],
 grupos:[{grupo:'A',tabela:[{pos:1,equipe:'ES VÔLEI',pontos:6},{pos:2,equipe:'CTV Aravôlei',pontos:3},{pos:3,equipe:'União vôlei',pontos:0}]},{grupo:'B',tabela:[{pos:1,equipe:'Equipe UVI',pontos:5},{pos:2,equipe:'Tiger volley',pontos:4},{pos:3,equipe:'CTVA Voleibol',pontos:1}]},{grupo:'C',tabela:[{pos:1,equipe:'CT das Montanhas',pontos:6},{pos:2,equipe:'Supra Vôlei',pontos:3},{pos:3,equipe:'MS Vôlei',pontos:0}]},{grupo:'D',tabela:[{pos:1,equipe:'Alpha Vôlei',pontos:5},{pos:2,equipe:'RPB Volei',pontos:3},{pos:3,equipe:'Super Vôlei',pontos:1}]}]};
var DEMO_AO=[{id:'A1',equipeCasa:'ES VÔLEI',equipeVisitante:'CTV Aravôlei',setAtual:2,pontosCasa:14,pontosVisitante:11,setsCasa:1,setsVisitante:0,sacando:'A',historicoSets:[{a:25,b:21}]},{id:'C3',equipeCasa:'Supra Vôlei',equipeVisitante:'MS Vôlei',setAtual:1,pontosCasa:8,pontosVisitante:9,setsCasa:0,setsVisitante:0,sacando:'B',historicoSets:[]}];
function carrega(){
 if(DEMO){T=DEMO_T;AO=JSON.parse(JSON.stringify(DEMO_AO));T.jogos.forEach(function(j){QMAP[j.id]=j.quadra});return Promise.resolve()}
 return get('torneio',{modalidade:'volei'}).then(function(t){T={jogos:t.jogos||[],grupos:t.grupos||[]};(t.jogos||[]).forEach(function(j){QMAP[String(j.id).toUpperCase()]=j.quadra||''})}).catch(function(){});
}
function aoVivo(){
 if(DEMO)return Promise.resolve();
 return get('partidasAoVivo').then(function(r){var l=r.partidas||[];return Promise.all(l.map(function(p){return get('partida',{id:p.id}).then(function(x){return x&&x.ok?x.estado:p}).catch(function(){return p})}))}).then(function(l){AO=l}).catch(function(){})
}
var nm=function(j,k){return k==='c'?(j.casaDefinida===false?(j.rotuloCasa||'A definir'):j.casa):(j.visitanteDefinida===false?(j.rotuloVisitante||'A definir'):j.visitante)};
var qCurta=function(q){return /principal/i.test(q)?'Quadra principal':/altern/i.test(q)?'Quadra alternativa':(q||'')};
function quadraDe(g,i){var q=String(QMAP[String(g.id).toUpperCase()]||'');if(/principal/i.test(q))return 'P';if(/altern/i.test(q))return 'A';return i===0?'P':'A'}
/* ---- cenas ---- */
function cLive(){
 var P=null,A=null;AO.forEach(function(g,i){var q=quadraDe(g,i);if(q==='P'&&!P)P=g;else if(q==='A'&&!A)A=g;else if(!P)P=g;else if(!A)A=g});
 function bloco(g,rot,q){
  if(!g){var prox=T.jogos.filter(function(j){return j.status!=='finalizado'&&j.status!=='wo'&&j.status!=='ao_vivo'&&new RegExp(q==='P'?'principal':'altern','i').test(j.quadra||'')}).sort(function(a,b){return (a.data+a.hora)<(b.data+b.hora)?-1:1})[0];
   return '<div class="qd vazia"><div class="tt">'+rot+'</div><div class="fx vz" style="flex:1"><div>Aguardando jogo'+(prox?'<b>'+esc(nm(prox,'c'))+' × '+esc(nm(prox,'v'))+'</b><em>'+esc(prox.hora||'')+'</em>':'')+'</div></div></div>'}
  var hs=(g.historicoSets||[]).map(function(s,i){return (i+1)+'º set '+s.a+' x '+s.b}).join('   ·   ');
  function lin(nome,sacou,sets,pts,alt){return '<div class="fx'+(alt?' alt':'')+' eq">'+SH(nome,118)+'<div class="n"><i class="'+(sacou?'on':'')+'"></i>'+esc(nome)+'</div><div class="s" style="'+(alt?'color:#1b52e0':'')+'">'+sets+'</div><div class="p">'+pts+'</div></div>'}
  return '<div class="qd"><div class="tt"><div>'+rot+'</div><span>SET '+(g.setAtual||1)+'</span></div>'
   +lin(g.equipeCasa,g.sacando==='A',g.setsCasa||0,g.pontosCasa||0,false)+lin(g.equipeVisitante,g.sacando==='B',g.setsVisitante||0,g.pontosVisitante||0,true)
   +'<div class="ft">'+(hs||'1º set em andamento')+'</div></div>'}
 return {t:'Placar ao vivo',h:'<div class="quadras">'+bloco(P,'Quadra principal','P')+bloco(A,'Quadra alternativa','A')+'</div>'}
}
function cProx(){
 var l=T.jogos.filter(function(j){return j.status!=='finalizado'&&j.status!=='wo'&&j.status!=='ao_vivo'&&j.data}).sort(function(a,b){return (a.data+(a.hora||''))<(b.data+(b.hora||''))?-1:1}).slice(0,6);
 if(!l.length)return null;
 return {t:'Próximos jogos',h:'<div class="lista">'+l.map(function(j,i){return '<div class="fx jg'+(i%2?' alt':'')+'"><div class="h">'+esc(j.hora||'--')+'</div><div class="m"><div class="t">'+SH(nm(j,'c'),84)+'<span>'+esc(nm(j,'c'))+'</span></div><div class="x"><em>×</em><small>'+esc(qCurta(j.quadra))+'</small></div><div class="t">'+SH(nm(j,'v'),84)+'<span>'+esc(nm(j,'v'))+'</span></div></div></div>'}).join('')+'</div>'}
}
function cClass(){
 var gs=(T.grupos||[]).filter(function(g){return g.tabela&&g.tabela.length});if(!gs.length)return null;
 return {t:'Classificação',h:'<div class="grupos">'+gs.slice(0,4).map(function(g){return '<div class="gr"><div class="gt">Grupo<b>'+esc(g.grupo)+'</b></div>'+g.tabela.map(function(t,i){return '<div class="li'+(i%2?' alt':'')+'"><b>'+(t.pos||i+1)+'º</b>'+SH(t.equipe,62)+'<span>'+esc(t.equipe)+'</span><u>'+(t.pontos||0)+'</u></div>'}).join('')+'</div>'}).join('')+'</div>'}
}
var G=[['Realização',[['prefeitura-afonso-claudio','Prefeitura']]],['Patrocinador Master',[['coroa-instituto','Coroa Instituto']]],['Patrocinadores Prata',[['planet-sports','Planet Sports'],['acai-do-diego','Açaí do Diego'],['casa-homem-do-campo','Casa Homem do Campo'],['sicredi','Sicredi'],['express-pizzas-e-lanches','Express Pizzas e Lanches'],['izi-internet','IZI Internet']]],['Patrocinador Bronze',[['prato-fino','Prato Fino'],['restaurante-do-marcao','Restaurante do Marcão'],['elite-suplementos','Elite Suplementos'],['jacare-fotografia','Jacaré Fotografia'],['laboratorio-cda','Laboratório CDA']]],['Apoio',[['basquetebol-das-montanhas','Basquetebol das Montanhas'],['instituto-cultural-das-montanhas','Instituto Cultural das Montanhas']]]];
var pi=0;
function cPatro(){
 var g=G[pi%G.length];pi++;var n=g[1].length,w=n===1?640:n<=2?700:n<=3?560:n<=4?420:360,h=n===1?400:n<=3?340:300;
 return {t:'Patrocinadores',h:'<div class="pt"><div class="ct">Quem faz a Supercopa acontecer<b>'+esc(g[0])+'</b></div><div class="lg" style="--w:'+w+'px;--h:'+h+'px">'+g[1].map(function(x){return '<div><img src="'+BASE+x[0]+'.png" alt="'+esc(x[1])+'"></div>'}).join('')+'</div></div>'}
}
/* ---- rotação ---- */
var seq=[],si=0,atual=null;
function montaSeq(){var s=[];var viv=AO.length>0;
 if(viv)s.push('live');s.push('prox');if(viv)s.push('live');s.push('class');if(viv)s.push('live');s.push('patro');s.push('patro');return s}
function constroi(k){return k==='live'?cLive():k==='prox'?cProx():k==='class'?cClass():cPatro()}
function mostra(k){
 var c=constroi(k);if(!c)return false;
 var el=document.createElement('div');el.className='sc';el.innerHTML=c.h;$('cena').appendChild(el);
 $('titulo').textContent=c.t;$('live').classList.toggle('on',AO.length>0);
 var vel=atual;atual=el;void el.offsetWidth;el.classList.add('on');
 if(vel){vel.classList.remove('on');vel.classList.add('sai');setTimeout(function(){vel.remove()},800)}
 $('bolas').innerHTML=seq.map(function(_,i){return '<i class="'+(i===si-1?'on':'')+'"></i>'}).join('');
 atual.__k=k;return true
}
function passo(){
 if(FIXA){mostra(FIXA);setTimeout(passo,TEMPO*1000);return}
 if(!seq.length||si>=seq.length){seq=montaSeq();si=0}
 var k=seq[si++],ok=mostra(k),tent=0;
 while(!ok&&tent<6){k=seq[si++%seq.length]||'patro';ok=mostra(k);tent++}
 setTimeout(passo,(k==='live'?TEMPO*1.2:TEMPO)*1000)
}
function atualizaLive(){if(atual&&atual.__k==='live'){atual.innerHTML=cLive().h}}
escudos().then(carrega).then(aoVivo).then(function(){passo();setInterval(carrega,60000);setInterval(function(){aoVivo().then(atualizaLive)},2000)});
})();
</script>
</body>
</html>
