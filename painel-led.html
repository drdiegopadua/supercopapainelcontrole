<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel de LED — Supercopa AFC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Barlow:wght@500;600;700&display=swap">
<style>
/* Painel de LED do ginásio · 1920x1080 · arte de transmissão esportiva.
   Parâmetros: ?tempo=14 (segundos por tela) · ?demo=1 (dados de exemplo) · ?cena=live|prox|class|patro (fixa uma tela) */
:root{--b1:#1b52e0;--b2:#0b2a8f;--b3:#071a5c;--gold:#ffd34d;--gold2:#ff9d1c;--ice:#cfe0ff;--red:#ff3b4e;--fd:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--b:'Barlow','Helvetica Neue',Arial,sans-serif}
html,body{margin:0;height:100%;background:#02071f;overflow:hidden}
*{box-sizing:border-box}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:#fff;font-family:var(--fd);overflow:hidden;background:#02071f}

/* ===== FUNDO CINEMATOGRÁFICO ===== */
#bg{position:absolute;inset:0;overflow:hidden}
.ph{position:absolute;inset:-6%;background:center/cover no-repeat;filter:saturate(.85) contrast(1.15) brightness(.72);opacity:0;transition:opacity 1.6s;animation:kb 26s ease-in-out infinite alternate}
.ph.on{opacity:1}
@keyframes kb{from{transform:scale(1.04) translate3d(-1.5%,0,0)}to{transform:scale(1.22) translate3d(2%,-2%,0)}}
.duo{position:absolute;inset:0;background:linear-gradient(135deg,rgba(2,10,52,.8),rgba(14,50,170,.5) 55%,rgba(2,10,52,.88));mix-blend-mode:multiply}
.mesh{position:absolute;inset:0;mix-blend-mode:screen}
.mesh i{position:absolute;width:980px;height:980px;border-radius:50%;filter:blur(130px);opacity:.5;animation:drift 19s ease-in-out infinite alternate}
.mesh i:nth-child(1){left:-12%;top:-30%;background:#2a6bff}
.mesh i:nth-child(2){right:-16%;top:6%;background:#00b8ff;animation-duration:23s;animation-delay:-6s;opacity:.38}
.mesh i:nth-child(3){left:28%;bottom:-48%;background:#6a35ff;animation-duration:27s;animation-delay:-11s;opacity:.4}
.mesh i:nth-child(4){right:8%;bottom:-40%;width:640px;height:640px;background:#ffb21c;animation-duration:21s;opacity:.18}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(130px,90px,0) scale(1.18)}}
.beams i{position:absolute;top:-30%;width:340px;height:170%;background:linear-gradient(90deg,transparent,rgba(190,215,255,.16),transparent);transform:rotate(20deg);filter:blur(10px);mix-blend-mode:screen;animation:beam 11s linear infinite}
.beams i:nth-child(1){left:-30%}.beams i:nth-child(2){left:-30%;animation-delay:-4s;width:220px;opacity:.7}.beams i:nth-child(3){left:-30%;animation-delay:-8s;width:420px;opacity:.5}
@keyframes beam{from{transform:translateX(0) rotate(20deg)}to{transform:translateX(2600px) rotate(20deg)}}
.floor{position:absolute;left:-30%;right:-30%;bottom:-8%;height:52%;transform:perspective(620px) rotateX(64deg);transform-origin:50% 100%;
 background-image:linear-gradient(rgba(130,180,255,.5) 2px,transparent 2px),linear-gradient(90deg,rgba(130,180,255,.5) 2px,transparent 2px);background-size:110px 110px;
 -webkit-mask:linear-gradient(transparent,#000 55%,transparent);mask:linear-gradient(transparent,#000 55%,transparent);opacity:.45;animation:floor 3.2s linear infinite}
@keyframes floor{to{background-position:0 110px}}
#part{position:absolute;inset:0;width:1920px;height:1080px;mix-blend-mode:screen}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,transparent 40%,rgba(1,5,28,.78) 100%)}
.grain{position:absolute;inset:0;opacity:.07;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 1px,transparent 1px 4px)}

/* ===== CABEÇALHO ===== */
#hdr{position:absolute;left:0;right:0;top:0;height:150px;display:flex;align-items:center;padding:0 56px;gap:30px;z-index:5}
#hdr .brand{position:relative;height:116px;padding:0 34px 0 28px;display:flex;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(16px);clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%);overflow:hidden}
#hdr .brand img{height:92px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
#hdr .brand::after,.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 5.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:150%}}
#hdr .tt{position:relative;flex:1;min-width:0;height:116px;padding:0 44px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(100deg,var(--b1),#2a73ff 60%,#0d3bd0);clip-path:polygon(34px 0,100% 0,calc(100% - 34px) 100%,0 100%);margin-left:-52px;box-shadow:0 0 60px rgba(42,115,255,.6)}
#hdr .tt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;background:linear-gradient(180deg,var(--gold),var(--gold2));clip-path:polygon(34px 0,100% 0,calc(100% - 34px) 100%,0 100%);transform:translateX(0)}
#hdr small{display:block;margin-left:26px;font:700 24px var(--b);letter-spacing:9px;text-transform:uppercase;color:var(--gold);text-shadow:0 0 14px rgba(255,211,77,.7)}
#hdr h1{margin:0 0 0 26px;font:italic 800 78px/.95 var(--fd);text-transform:uppercase;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,20,90,.55),0 0 30px rgba(160,200,255,.6);transition:opacity .25s,transform .35s}
#hdr h1.troca{opacity:0;transform:translateX(-30px)}
#hdr .rel{height:116px;min-width:220px;padding:0 34px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(16px);clip-path:polygon(34px 0,100% 0,100% 100%,0 100%);font:italic 800 82px/1 var(--fd);letter-spacing:2px;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(160,200,255,.7)}
#hdr .live{display:none;position:relative;height:116px;padding:0 36px;align-items:center;gap:16px;background:linear-gradient(135deg,#ff3b4e,#c4122a);clip-path:polygon(0 0,100% 0,calc(100% - 28px) 100%,0 100%);font:italic 800 56px/1 var(--fd);letter-spacing:4px;box-shadow:0 0 50px rgba(255,59,78,.7)}
#hdr .live.on{display:flex}
#hdr .live i{position:relative;width:24px;height:24px;border-radius:50%;background:#fff}
#hdr .live i::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(255,255,255,.8);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.9);opacity:0}}

/* ===== CENA ===== */
#cena{position:absolute;left:0;right:0;top:166px;bottom:112px;z-index:3;perspective:1600px}
.sc{position:absolute;inset:0;padding:6px 56px 8px}
.rv{opacity:0;transform:translateY(46px) scale(.96);filter:blur(12px);animation:rv .85s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--d,0)*75ms + 520ms)}
@keyframes rv{to{opacity:1;transform:none;filter:none}}
.rvx{opacity:0;transform:translateX(120px) rotateY(-24deg);transform-origin:100% 50%;filter:blur(10px);animation:rvx .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--d,0)*90ms + 520ms)}
@keyframes rvx{to{opacity:1;transform:none;filter:none}}
.gl{background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 24px 70px rgba(0,8,50,.55),inset 0 1px 0 rgba(255,255,255,.4)}
/* escudo hexagonal */
.cr{position:relative;flex:none;width:var(--s,120px);height:var(--s,120px);display:grid;place-items:center}
.cr::before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,var(--gold),var(--gold2) 45%,#fff4c2);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);filter:drop-shadow(0 0 14px rgba(255,200,60,.65))}
.cr span{position:relative;width:88%;height:88%;display:grid;place-items:center;background:#fff;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.cr img{width:72%;height:72%;object-fit:contain}.cr b{font:italic 800 calc(var(--s,120px)*.46) var(--fd);color:var(--b2)}

/* ===== AO VIVO ===== */
.quadras{display:grid;grid-template-columns:1fr 1fr;gap:34px;height:100%}
.qd{display:flex;flex-direction:column;gap:14px;min-width:0;height:100%}
.qh{display:flex;justify-content:space-between;align-items:center;height:70px;padding:0 30px;background:linear-gradient(100deg,rgba(255,255,255,.2),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(14px);clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%)}
.qh span{font:700 30px var(--b);letter-spacing:7px;text-transform:uppercase;color:var(--gold);text-shadow:0 0 16px rgba(255,211,77,.55)}
.qh b{font:italic 800 52px var(--fd);letter-spacing:3px}
.body{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.row{position:relative;flex:1;display:grid;grid-template-columns:150px 1fr 96px 270px;align-items:center;gap:6px;padding:0 0 0 18px;min-height:0;overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,0 100%)}
.row::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(11,42,143,.88),rgba(27,82,224,.7) 60%,rgba(11,42,143,.88));border-top:4px solid #66a0ff}
.row.b::before{background:linear-gradient(100deg,rgba(230,238,255,.96),rgba(190,208,255,.9));border-top-color:#fff}
.row>*{position:relative}
.row .nm{color:#fff;display:flex;align-items:center;gap:16px;font:italic 800 70px/.95 var(--fd);text-transform:uppercase;min-width:0;overflow-wrap:anywhere;text-shadow:0 3px 0 rgba(0,20,90,.5)}
.row.b .nm{color:#0b2a8f;text-shadow:none}
.sv{flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 45%,var(--gold2));box-shadow:0 0 22px rgba(255,200,60,.9);opacity:0;transform:scale(.3)}
.sv.on{opacity:1;transform:scale(1);animation:bola 1.1s ease-in-out infinite}
@keyframes bola{50%{transform:translateY(-9px) scale(1.05)}}
.sd{display:flex;gap:10px;justify-content:center}.sd i{width:30px;height:30px;border-radius:50%;border:4px solid rgba(255,255,255,.55);background:transparent}.row.b .sd i{border-color:rgba(11,42,143,.5)}
.sd i.w{background:var(--gold);border-color:var(--gold);box-shadow:0 0 18px rgba(255,211,77,.85)}
.pts{position:relative;height:100%;display:grid;place-items:center;background:linear-gradient(180deg,#ffffff,#cfdcff 70%,#b6c9ff);color:var(--b2);overflow:hidden;clip-path:polygon(24px 0,100% 0,100% 100%,0 100%)}
.pts::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
.pts .d{position:relative;z-index:1;font:italic 800 190px/1 var(--fd);font-variant-numeric:tabular-nums;text-shadow:0 6px 0 rgba(11,42,143,.12)}
.pts .d.bump{animation:bump .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes bump{0%{transform:translateY(-70%) rotateX(80deg) scale(.7);opacity:0;filter:blur(8px)}55%{transform:translateY(6%) rotateX(-10deg) scale(1.22);opacity:1;filter:none;color:#1b52e0}100%{transform:none}}
.row.flash::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7),transparent 70%);animation:flash 1s ease-out}
@keyframes flash{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.hist{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:50px}
.hist span{padding:6px 26px;font:italic 700 36px var(--fd);letter-spacing:2px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);text-transform:uppercase}
.vz{flex:1;display:grid;place-items:center;text-align:center;padding:0 40px;font:italic 800 70px/1.05 var(--fd);text-transform:uppercase;color:var(--ice)}
.vz b{display:block;color:#fff;font-size:92px;margin:18px 0 6px;text-shadow:0 0 30px rgba(160,200,255,.7)}.vz em{font-style:normal;color:var(--gold);text-shadow:0 0 24px rgba(255,211,77,.7)}

/* ===== PRÓXIMOS JOGOS ===== */
.lista{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:20px 28px;height:100%}
.jg{position:relative;display:grid;grid-template-columns:290px 1fr;align-items:center;min-height:0;overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.jg .h{padding-left:26px;font:italic 800 96px/1 var(--fd);color:var(--gold);text-shadow:0 0 30px rgba(255,211,77,.65),0 4px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.jg .m{display:flex;flex-direction:column;gap:6px;padding:0 20px 0 0;min-width:0}
.jg .q{align-self:flex-start;padding:2px 18px;font:700 24px var(--b);letter-spacing:5px;text-transform:uppercase;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1000;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.jg .t{display:flex;align-items:center;gap:12px;font:italic 800 46px/1 var(--fd);text-transform:uppercase;min-width:0}
.jg .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg .vs{font:italic 800 30px var(--fd);color:var(--gold);letter-spacing:4px;margin:-2px 0 -2px 70px;opacity:.9}

/* ===== CLASSIFICAÇÃO ===== */
.grupos{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:22px 30px;height:100%}
.gr{display:flex;flex-direction:column;gap:6px;min-width:0}
.gr .gt{display:flex;align-items:baseline;gap:14px;font:700 28px var(--b);letter-spacing:8px;text-transform:uppercase;color:var(--gold);text-shadow:0 0 14px rgba(255,211,77,.5)}
.gr .gt b{font:italic 800 56px var(--fd);color:#fff;letter-spacing:2px;text-shadow:0 0 22px rgba(160,200,255,.7)}
.li{position:relative;flex:1;display:grid;grid-template-columns:78px 78px 1fr 110px;align-items:center;gap:10px;padding:0 22px 0 16px;min-height:0;overflow:hidden;font:italic 800 52px/1 var(--fd);text-transform:uppercase;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.li .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(42,115,255,.8),rgba(0,184,255,.15));animation:barra 1.4s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:1s}
@keyframes barra{to{width:var(--w,50%)}}
.li>*{position:relative}.li .p{display:grid;place-items:center;width:58px;height:58px;font:italic 800 38px var(--fd);background:linear-gradient(145deg,var(--gold),var(--gold2));color:#1a1000;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.li.q2 .p{box-shadow:none}.li:not(.q2) .p{background:rgba(255,255,255,.25);color:#fff}
.li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li u{text-decoration:none;text-align:right;font-size:62px;color:var(--gold);text-shadow:0 0 20px rgba(255,211,77,.5)}

/* ===== PATROCINADORES ===== */
.pt{height:100%;display:flex;flex-direction:column;align-items:center}
.pt .ct{text-align:center}
.pt .ct small{display:block;font:700 30px var(--b);letter-spacing:12px;text-transform:uppercase;color:var(--gold);text-shadow:0 0 16px rgba(255,211,77,.6)}
.pt .ct b{display:block;margin-top:2px;font:italic 800 110px/1 var(--fd);text-transform:uppercase;letter-spacing:2px;text-shadow:0 5px 0 rgba(0,20,90,.5),0 0 40px rgba(160,200,255,.6)}
.pt .ct i{display:block;margin:10px auto 0;height:8px;width:0;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),transparent);animation:ul 1s cubic-bezier(.2,.9,.2,1) .9s forwards;box-shadow:0 0 22px rgba(255,200,60,.8)}
@keyframes ul{to{width:760px}}
.pt .lg{flex:1;display:flex;flex-wrap:wrap;gap:30px;align-content:center;justify-content:center;perspective:1200px}
.pt .cd{position:relative;width:var(--w,520px);height:var(--h,300px);display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#fff,#e6eeff);border-radius:30px;overflow:hidden;box-shadow:0 30px 70px rgba(0,8,50,.6),0 0 0 3px rgba(255,255,255,.4),0 0 60px rgba(100,160,255,.5);animation:flut 6s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-1.3s)}
@keyframes flut{from{transform:rotateY(-7deg) translateY(0)}to{transform:rotateY(7deg) translateY(-12px)}}
.pt .cd img{max-width:100%;max-height:100%;object-fit:contain;position:relative}
.pt .cd::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(120,170,255,.45),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*.5s)}

/* ===== FAIXA INFERIOR ===== */
#tick{position:absolute;left:0;right:0;bottom:0;height:96px;z-index:5;display:flex;align-items:center;background:linear-gradient(180deg,rgba(4,16,70,.55),rgba(2,8,40,.92));backdrop-filter:blur(14px);border-top:3px solid var(--gold);box-shadow:0 -10px 50px rgba(0,10,70,.6)}
#tick .lb{position:relative;z-index:2;height:100%;padding:0 52px 0 46px;display:flex;align-items:center;background:linear-gradient(100deg,var(--gold),var(--gold2));color:#1a1000;font:italic 800 48px var(--fd);letter-spacing:4px;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%)}
#tick .wr{flex:1;min-width:0;overflow:hidden;margin-left:-10px}
#tick .tr{display:flex;gap:80px;white-space:nowrap;width:max-content;animation:corre 70s linear infinite;font:700 42px var(--b);letter-spacing:4px;text-transform:uppercase;color:var(--ice)}
#tick .tr b{color:#fff}#tick .tr i{font-style:normal;color:var(--gold)}
@keyframes corre{to{transform:translateX(-50%)}}
#bolas{position:absolute;right:30px;top:-26px;display:flex;gap:10px}#bolas i{width:42px;height:6px;background:rgba(255,255,255,.3);border-radius:3px}#bolas i.on{background:var(--gold);box-shadow:0 0 14px rgba(255,211,77,.9)}

/* ===== TRANSIÇÃO (stinger) ===== */
#sting{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
#sting i{position:absolute;top:-10%;bottom:-10%;left:-60%;width:46%;transform:skewX(-18deg)}
#sting i:nth-child(1){background:linear-gradient(180deg,var(--b1),var(--b2))}
#sting i:nth-child(2){background:linear-gradient(180deg,var(--gold),var(--gold2));width:14%}
#sting i:nth-child(3){background:#fff;width:5%}
#sting.go i:nth-child(1){animation:st 1.15s cubic-bezier(.7,0,.2,1) forwards}
#sting.go i:nth-child(2){animation:st 1.15s cubic-bezier(.7,0,.2,1) .07s forwards}
#sting.go i:nth-child(3){animation:st 1.15s cubic-bezier(.7,0,.2,1) .14s forwards}
@keyframes st{from{left:-60%}to{left:160%}}
</style>
</head>
<body>
<div id="stage">
 <div id="bg">
  <div class="ph" id="ph1"></div><div class="ph" id="ph2"></div>
  <div class="duo"></div>
  <div class="mesh"><i></i><i></i><i></i><i></i></div>
  <div class="beams"><i></i><i></i><i></i></div>
  <div class="floor"></div>
  <canvas id="part" width="1920" height="1080"></canvas>
  <div class="vig"></div><div class="grain"></div>
 </div>
 <div id="hdr">
  <div class="brand"><img src="https://www.supercopaafc.com.br/novo/logo-branco.png" alt=""></div>
  <div class="tt"><small>Supercopa AFC · Vôlei 2026</small><h1 id="titulo">Supercopa</h1></div>
  <div class="live" id="live"><i></i>AO VIVO</div>
  <div class="rel" id="rel">--:--</div>
 </div>
 <div id="cena"></div>
 <div id="tick"><div id="bolas"></div><div class="lb">Supercopa</div><div class="wr"><div class="tr" id="tr"></div></div></div>
 <div id="sting"><i></i><i></i><i></i></div>
</div>
<script>
(function(){
var API='https://hngwasixgyvnvfanpuax.supabase.co/functions/v1/api',Q=new URLSearchParams(location.search),DEMO=Q.has('demo'),TEMPO=Math.max(5,parseFloat(Q.get('tempo'))||14),FIXA=Q.get('cena');
var SITE='https://www.supercopaafc.com.br/',BASE=SITE+'novo/parceiros/',$=function(i){return document.getElementById(i)},stage=$('stage'),ESC={};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function ajusta(){var s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+s+')';stage.style.left=((innerWidth-1920*s)/2)+'px';stage.style.top=((innerHeight-1080*s)/2)+'px'}
addEventListener('resize',ajusta);ajusta();
