<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2º Árbitro · Súmula Supercopa</title>
<meta name="theme-color" content="#0d1f5c">
<link rel="manifest" href="arbitro2-manifest.webmanifest">
<link rel="apple-touch-icon" href="https://drdiegopadua.github.io/supercopa-app/apple-touch-icon.png">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<style>
:root{--blue:#1565c0;--orange:#e65100;--dark:#111827;--grey:#6b7280;--border:#e5e7eb;--bg:#f4f6fb;--green:#16a34a;--red:#dc2626;--gold:#c8960c;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior-y:contain;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--dark);padding-bottom:24px;}
header{background:linear-gradient(135deg,#0d1f5c,#1565c0);color:#fff;padding:16px 18px;text-align:center;position:sticky;top:0;z-index:10}
header .tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.75}
header h1{font-size:17px;font-weight:800;margin-top:2px}
.wrap{max-width:480px;margin:0 auto;padding:14px;}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.card h2{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
select,input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fbfcfe;margin-bottom:8px}
.btn{border:none;border-radius:10px;padding:12px;font-weight:700;font-size:13px;cursor:pointer}
.btn-primary{background:var(--blue);color:#fff;width:100%}
.score-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0}
.score-big{font-size:42px;font-weight:900}
.team-name{font-weight:800;font-size:13px;text-align:center}
.quadras{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pos-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px}
.pos-cell{position:relative;background:#fff;border:2px solid #dcdcdc;border-radius:8px;padding:6px 2px;text-align:center;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pos-cell.saque{background:#fff8e1;border-color:var(--gold)}
.court{background:linear-gradient(180deg,#dff3e0,#c8e6c9);border:2px solid #66bb6a;border-radius:8px;padding:6px}
.point-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.point-btns button{border:none;border-radius:14px;padding:24px 8px;font-size:16px;font-weight:800;color:#fff}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn-sec{background:#eef1f6;color:var(--dark);border:none;border-radius:10px;padding:10px;font-size:12px;font-weight:700}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2);}
.toast.show{display:block}
.toast.error{background:var(--red)}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8f9fc;border-radius:8px;margin-bottom:6px;font-size:12px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:flex-end}
.modal-bg.show{display:flex}
.modal-box{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:20px;max-height:80vh;overflow-y:auto}
</style>
</head>
<body>
<header>
  <div class="tag">Supercopa AFC · Vôlei</div>
  <h1 id="hdrTitle">🏐 Console do 2º Árbitro</h1>
</header>

<div class="wrap">
  <div class="card" id="pickerCard">
    <h2><i class='bx bx-search'></i> Entrar numa partida</h2>
    <select id="jogoSelect"><option value="">Carregando partidas ao vivo...</option></select>
    <input id="jogoManual" placeholder="Ou digite o ID do jogo (ex: A1, TESTE1)">
    <button class="btn btn-primary" onclick="entrarPartida()">Entrar</button>
  </div>

  <div id="consoleWrap" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalCartao">
  <div class="modal-box">
    <h2 style="font-size:15px;font-weight:800;margin-bottom:12px">🏳️ Cartão</h2>
    <select id="mc-equipe"></select>
    <input id="mc-jogador" placeholder="Jogador(a)">
    <select id="mc-tipo"><option value="Amarelo">🟨 Amarelo</option><option value="Vermelho">🟥 Vermelho</option></select>
    <input id="mc-motivo" placeholder="Motivo (opcional)">
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn-sec" style="flex:1" onclick="fecharModal('modalCartao')">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="salvarCartao()">Salvar</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalSub">
  <div class="modal-box">
    <h2 style="font-size:15px;font-weight:800;margin-bottom:12px">🔄 Substituição</h2>
    <select id="ms-equipe"></select>
    <input id="ms-saiu" placeholder="Saiu">
    <input id="ms-entrou" placeholder="Entrou">
    <input id="ms-numero" placeholder="Número de quem entra (opcional)">
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn-sec" style="flex:1" onclick="fecharModal('modalSub')">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="salvarSub()">Salvar</button>
    </div>
  </div>
</div>

<script>
const SUMULA_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGHciyvcdSDszUOyz1pgdCG8nE8ySGwdKUNgjWybc6GrDJAb6_q-3zI9IWkpU9QL0UfQ/exec";

let estado = null;
let pollTimer = null;

function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

async function carregarListaJogos(){
  const sel = document.getElementById('jogoSelect');
  try{
    const res = await fetch(SUMULA_SCRIPT_URL + '?action=partidasAoVivo').then(r=>r.json());
    const partidas = (res && res.partidas) || [];
    sel.innerHTML = '<option value="">— selecione —</option>' + partidas.map(p => `<option value="${p.id}">${p.id} — ${p.equipeCasa} x ${p.equipeVisitante} (${p.pontosCasa}-${p.pontosVisitante})</option>`).join('');
  } catch(e){
    sel.innerHTML = '<option value="">Erro ao carregar</option>';
  }
}

async function entrarPartida(){
  const id = (document.getElementById('jogoManual').value.trim() || document.getElementById('jogoSelect').value).toUpperCase();
  if (!id){ showToast('Selecione ou digite o ID do jogo.', 'error'); return; }
  try{
    const res = await fetch(SUMULA_SCRIPT_URL + '?action=partida&id=' + encodeURIComponent(id)).then(r=>r.json());
    if (!res.ok || !res.estado){ showToast('Partida não encontrada. Ela precisa ser criada primeiro no painel.', 'error'); return; }
    estado = res.estado;
    document.getElementById('pickerCard').style.display = 'none';
    document.getElementById('consoleWrap').style.display = '';
    document.getElementById('hdrTitle').textContent = '🏐 ' + estado.equipeCasa + ' x ' + estado.equipeVisitante;
    render();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(poll, 4000);
  } catch(e){ showToast('Erro de conexão.', 'error'); }
}

async function poll(){
  if (!estado || estado.status === 'finalizada') { if (pollTimer) clearInterval(pollTimer); return; }
  try{
    const res = await fetch(SUMULA_SCRIPT_URL + '?action=partida&id=' + encodeURIComponent(estado.id)).then(r=>r.json());
    if (res.ok && res.estado){ estado = res.estado; render(); }
  } catch(e){}
}

function quadraHtml(rotacao){
  if (!rotacao || !rotacao.length) return '<div style="text-align:center;color:var(--grey);font-size:11px;padding:16px 0">sem escalação</div>';
  const por = {1:rotacao[0],2:rotacao[1],3:rotacao[2],4:rotacao[3],5:rotacao[4],6:rotacao[5]};
  const cel = (pos) => {
    const p = por[pos] || {};
    const saque = pos === 1;
    return `<div class="pos-cell ${saque?'saque':''}"><div style="font-weight:800;font-size:14px;${saque?'color:var(--gold)':''}">${p.numero||'—'}</div><div style="font-size:6px;color:${saque?'var(--gold)':'var(--grey)'}">${saque?'SAQUE':'P'+pos}</div></div>`;
  };
  return `<div class="court"><div style="text-align:center;font-size:6px;font-weight:800;color:#2e7d32;margin-bottom:4px">◤ REDE ◥</div>
    <div class="pos-grid" style="margin-bottom:3px">${cel(4)}${cel(3)}${cel(2)}</div>
    <div class="pos-grid">${cel(5)}${cel(6)}${cel(1)}</div></div>`;
}

function setDotsHtml(historico){
  let html = '';
  for (let i=0;i<3;i++){
    if (historico[i]){
      const v = historico[i].a > historico[i].b ? 'A' : 'B';
      html += `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 2px;background:${v==='A'?'var(--blue)':'var(--orange)'}"></span>`;
    } else {
      html += `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 2px;background:#e5e7eb"></span>`;
    }
  }
  return html;
}

function render(){
  const s = estado;
  const el = document.getElementById('consoleWrap');
  const emAndamento = s.status === 'em_andamento';
  const prontaFinalizar = s.status === 'sets_completos';
  const finalizada = s.status === 'finalizada';

  const eventos = [];
  (s.timeouts||[]).forEach((t,i)=>eventos.push({o:900+i, h:`<div class="list-item"><i class='bx bx-time-five' style="color:var(--orange)"></i><span style="flex:1">Tempo · ${t.equipe==='A'?s.equipeCasa:s.equipeVisitante} · Set ${t.set}</span></div>`}));
  (s.cartoes||[]).forEach((c,i)=>eventos.push({o:800+i, h:`<div class="list-item">${c.tipo==='Vermelho'?'🟥':'🟨'}<span style="flex:1">${c.jogador} · Set ${c.set}</span></div>`}));
  (s.substituicoes||[]).forEach((sub,i)=>eventos.push({o:700+i, h:`<div class="list-item"><i class='bx bx-transfer' style="color:var(--blue)"></i><span style="flex:1">${sub.equipe==='A'?s.equipeCasa:s.equipeVisitante} · ${sub.saiu} ➜ ${sub.entrou}</span></div>`}));

  el.innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:10px;color:var(--grey)">${finalizada?'🏁 FINALIZADA':prontaFinalizar?'✅ PRONTA PRA FINALIZAR':'🔴 AO VIVO'} · SET ${Math.min(s.setAtual,3)}</div>
      <div class="score-row">
        <div style="flex:1"><div class="team-name">${s.equipeCasa}</div>${setDotsHtml(s.historicoSets)}</div>
        <div class="score-big">${s.pontosCasa}<span style="color:var(--grey);font-size:20px"> × </span>${s.pontosVisitante}</div>
        <div style="flex:1"><div class="team-name">${s.equipeVisitante}</div>${setDotsHtml(s.historicoSets)}</div>
      </div>
      <div style="font-size:12px;color:var(--grey)">Sets: <strong>${s.setsCasa}</strong> × <strong>${s.setsVisitante}</strong></div>
    </div>

    <div class="card">
      <h2><i class='bx bxs-volleyball'></i> Quadra ao Vivo</h2>
      <div class="quadras">
        <div><div style="text-align:center;font-size:10px;font-weight:700;color:var(--blue);margin-bottom:4px">${s.equipeCasa}</div>${quadraHtml(s.rotacaoCasa)}</div>
        <div><div style="text-align:center;font-size:10px;font-weight:700;color:var(--orange);margin-bottom:4px">${s.equipeVisitante}</div>${quadraHtml(s.rotacaoVisitante)}</div>
      </div>
    </div>

    ${emAndamento ? `
    <div class="card">
      <div class="point-btns">
        <button style="background:var(--blue)" onclick="ponto('A')">+1 PONTO<br><span style="font-size:10px;font-weight:600;opacity:.85">${s.equipeCasa}</span></button>
        <button style="background:var(--orange)" onclick="ponto('B')">+1 PONTO<br><span style="font-size:10px;font-weight:600;opacity:.85">${s.equipeVisitante}</span></button>
      </div>
      <button class="btn-sec" style="width:100%;margin-top:10px" onclick="desfazer()"><i class='bx bx-undo'></i> Desfazer último ponto</button>
      <div class="actions-grid">
        <button class="btn-sec" onclick="timeout('A')">⏱ Tempo · Casa</button>
        <button class="btn-sec" onclick="timeout('B')">⏱ Tempo · Visitante</button>
        <button class="btn-sec" onclick="abrirModalCartao()">🏳️ Cartão</button>
        <button class="btn-sec" onclick="abrirModalSub()">🔄 Substituição</button>
      </div>
    </div>` : ''}

    ${prontaFinalizar ? `<div class="card" style="text-align:center;background:#e8f5e9"><p style="font-size:12px;color:var(--green);font-weight:700">Partida decidida — finalize pelo painel principal pra gerar o PDF.</p></div>` : ''}
    ${finalizada ? `<div class="card" style="text-align:center"><p style="font-size:12px;color:var(--green);font-weight:700"><i class='bx bx-check-circle'></i> Súmula finalizada.</p></div>` : ''}

    <div class="card">
      <h2><i class='bx bx-list-ul'></i> Linha do tempo</h2>
      ${eventos.length ? eventos.sort((a,b)=>b.o-a.o).map(e=>e.h).join('') : '<p style="color:var(--grey);font-size:12px">Nenhum evento ainda.</p>'}
    </div>
  `;
}

async function ponto(equipe){
  try{
    const res = await fetch(SUMULA_SCRIPT_URL, {method:'POST', body: JSON.stringify({acao:'ponto', id:estado.id, equipe:equipe})}).then(r=>r.json());
    if (res.ok){ estado = res.estado; render(); } else showToast(res.erro||'erro', 'error');
  } catch(e){ showToast('Erro de conexão.', 'error'); }
}
async function desfazer(){
  try{
    const res = await fetch(SUMULA_SCRIPT_URL, {method:'POST', body: JSON.stringify({acao:'desfazerPonto', id:estado.id})}).then(r=>r.json());
    if (res.ok){ estado = res.estado; render(); } else showToast(res.erro||'erro', 'error');
  } catch(e){ showToast('Erro de conexão.', 'error'); }
}
async function timeout(equipe){
  try{
    const res = await fetch(SUMULA_SCRIPT_URL, {method:'POST', body: JSON.stringify({acao:'timeout', id:estado.id, equipe:equipe})}).then(r=>r.json());
    if (res.ok){ estado = res.estado; render(); showToast('⏱ Tempo registrado.'); }
  } catch(e){ showToast('Erro de conexão.', 'error'); }
}

function abrirModal(id){ document.getElementById(id).classList.add('show'); }
function fecharModal(id){ document.getElementById(id).classList.remove('show'); }

function abrirModalCartao(){
  document.getElementById('mc-equipe').innerHTML = `<option value="A">${estado.equipeCasa}</option><option value="B">${estado.equipeVisitante}</option>`;
  document.getElementById('mc-jogador').value = '';
  document.getElementById('mc-motivo').value = '';
  abrirModal('modalCartao');
}
async function salvarCartao(){
  const jogador = document.getElementById('mc-jogador').value.trim();
  if (!jogador){ showToast('Informe o jogador.', 'error'); return; }
  const payload = {acao:'cartao', id:estado.id, equipe:document.getElementById('mc-equipe').value, jogador:jogador, tipo:document.getElementById('mc-tipo').value, motivo:document.getElementById('mc-motivo').value.trim()};
  const res = await fetch(SUMULA_SCRIPT_URL, {method:'POST', body: JSON.stringify(payload)}).then(r=>r.json());
  if (res.ok){ estado = res.estado; render(); fecharModal('modalCartao'); } else showToast(res.erro||'erro', 'error');
}

function abrirModalSub(){
  document.getElementById('ms-equipe').innerHTML = `<option value="A">${estado.equipeCasa}</option><option value="B">${estado.equipeVisitante}</option>`;
  document.getElementById('ms-saiu').value = '';
  document.getElementById('ms-entrou').value = '';
  document.getElementById('ms-numero').value = '';
  abrirModal('modalSub');
}
async function salvarSub(){
  const saiu = document.getElementById('ms-saiu').value.trim();
  const entrou = document.getElementById('ms-entrou').value.trim();
  if (!saiu || !entrou){ showToast('Informe quem saiu e quem entrou.', 'error'); return; }
  const payload = {acao:'substituicao', id:estado.id, equipe:document.getElementById('ms-equipe').value, saiu:saiu, entrou:entrou, numeroEntrou:document.getElementById('ms-numero').value.trim()};
  const res = await fetch(SUMULA_SCRIPT_URL, {method:'POST', body: JSON.stringify(payload)}).then(r=>r.json());
  if (res.ok){ estado = res.estado; render(); fecharModal('modalSub'); } else showToast(res.erro||'erro', 'error');
}

// Se veio com ?jogo=ID na URL, entra direto.
(function(){
  const params = new URLSearchParams(location.search);
  const jogoUrl = params.get('jogo');
  if (jogoUrl) document.getElementById('jogoManual').value = jogoUrl.toUpperCase();
})();

carregarListaJogos();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('arbitro2-sw.js').catch(()=>{});
}
</script>
</body>
</html>
