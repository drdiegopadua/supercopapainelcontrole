<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Overlay Classificação · Supercopa AFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@500;600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Condensed',sans-serif}

#stage{
  position:absolute;top:0;left:0;
  width:1920px;height:1080px;
  transform-origin:0 0;
  background:linear-gradient(160deg,#060b1a 0%,#0b1530 50%,#07101f 100%);
}

/* ── textura de fundo ── */
#stage::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 900px 400px at 25% 50%,rgba(27,82,224,.07) 0%,transparent 70%),
    radial-gradient(ellipse 900px 400px at 75% 50%,rgba(27,82,224,.07) 0%,transparent 70%);
  pointer-events:none;
}

/* ── topo ── */
#header{
  position:absolute;top:0;left:0;right:0;height:88px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 48px;
  border-bottom:2px solid rgba(27,82,224,.4);
  background:linear-gradient(90deg,rgba(27,82,224,.18) 0%,rgba(27,82,224,.06) 50%,rgba(27,82,224,.18) 100%);
}
.hdr-left{display:flex;align-items:center;gap:20px}
.hdr-label{
  font-size:13px;font-weight:700;letter-spacing:5px;text-transform:uppercase;
  color:rgba(255,255,255,.4);
}
.hdr-title{
  font-size:52px;font-weight:900;letter-spacing:4px;text-transform:uppercase;
  color:#fff;line-height:1;
}
.hdr-title span{color:#1b52e0}
.hdr-badge{
  display:flex;align-items:center;gap:10px;
  font-size:22px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:rgba(255,255,255,.85);
}
.hdr-badge img{height:52px;object-fit:contain}
.hdr-modality{
  font-size:14px;font-weight:700;letter-spacing:4px;text-transform:uppercase;
  color:#f5b800;
  background:rgba(245,184,0,.12);
  border:1px solid rgba(245,184,0,.3);
  border-radius:4px;
  padding:4px 14px;
}

/* ── separador horizontal ── */
#divh{
  position:absolute;top:88px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(27,82,224,.6) 20%,rgba(27,82,224,.6) 80%,transparent);
}

/* ── grade 2×2 ── */
#grid{
  position:absolute;top:90px;left:0;right:0;bottom:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:0;
}

/* separador vertical */
#grid::after{
  content:'';
  position:absolute;top:20px;bottom:20px;left:50%;
  width:2px;
  background:linear-gradient(180deg,transparent,rgba(27,82,224,.4) 20%,rgba(27,82,224,.4) 80%,transparent);
  transform:translateX(-50%);
  pointer-events:none;
}
/* separador horizontal inferior */
#grid::before{
  content:'';
  position:absolute;left:20px;right:20px;top:50%;
  height:2px;
  background:linear-gradient(90deg,transparent,rgba(27,82,224,.4) 20%,rgba(27,82,224,.4) 80%,transparent);
  transform:translateY(-50%);
  pointer-events:none;
}

/* ── célula de grupo ── */
.grupo-cell{
  padding:22px 40px 18px;
  display:flex;flex-direction:column;gap:12px;
  animation:fadeIn .5s both;
}
.grupo-cell:nth-child(1){animation-delay:.05s}
.grupo-cell:nth-child(2){animation-delay:.1s}
.grupo-cell:nth-child(3){animation-delay:.15s}
.grupo-cell:nth-child(4){animation-delay:.2s}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.grupo-header{
  display:flex;align-items:center;gap:14px;
  margin-bottom:4px;
}
.grupo-letra{
  display:flex;align-items:center;justify-content:center;
  width:52px;height:52px;border-radius:12px;
  background:linear-gradient(135deg,#1b52e0,#0b2a8f);
  font-size:30px;font-weight:900;color:#fff;letter-spacing:0;
  flex-shrink:0;
  box-shadow:0 4px 20px rgba(27,82,224,.5);
}
.grupo-info{line-height:1.15}
.grupo-nome{font-size:28px;font-weight:900;color:#fff;letter-spacing:1px;text-transform:uppercase}
.grupo-sub{font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.35)}

/* ── tabela ── */
.tabela{width:100%;border-collapse:collapse}

.tabela thead tr{border-bottom:1px solid rgba(255,255,255,.1)}
.tabela thead th{
  font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.35);
  padding:0 12px 10px;
  text-align:center;
}
.tabela thead th.th-equipe{text-align:left;padding-left:0}

.tabela tbody tr{
  border-bottom:1px solid rgba(255,255,255,.05);
  transition:background .15s;
}
.tabela tbody tr:last-child{border:none}

/* destaque 1º lugar */
.tabela tbody tr.pos-1 .td-pos{color:#f5b800}
.tabela tbody tr.pos-1 .td-name{color:#fff}
.tabela tbody tr.pos-2 .td-pos{color:rgba(255,255,255,.7)}
.tabela tbody tr.pos-3 .td-pos{color:rgba(255,255,255,.45)}

.tabela tbody td{
  padding:14px 12px;
  font-size:30px;font-weight:700;
  color:rgba(255,255,255,.75);
  text-align:center;vertical-align:middle;
}

/* coluna posição */
.td-pos{
  font-size:26px;font-weight:900;width:36px;
  text-align:center;padding-left:0;
}

/* coluna time */
.td-equipe{text-align:left;padding-left:0}
.team-row{display:flex;align-items:center;gap:10px}
.team-badge{
  width:48px;height:48px;border-radius:50%;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
}
.team-badge img{width:40px;height:40px;object-fit:contain}
.badge-init{font-size:15px;font-weight:900;color:rgba(255,255,255,.4);font-family:'Barlow Condensed',sans-serif}
.td-name{
  font-size:30px;font-weight:800;
  color:rgba(255,255,255,.85);
  letter-spacing:.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:320px;
}

/* coluna pontos em destaque */
.td-pts{
  font-size:36px;font-weight:900;
  color:#fff;
}
.tabela tbody tr.pos-1 .td-pts{color:#f5b800}

/* destaque para líder: linha com fundo */
.tabela tbody tr.pos-1{
  background:rgba(245,184,0,.06);
  border-radius:8px;
}

/* destaque pontos */
.td-pts{border-left:2px solid rgba(27,82,224,.3);padding-left:16px!important}

/* ── rodapé ── */
#footer{
  position:absolute;bottom:0;left:0;right:0;height:0;
}

/* ── loading ── */
#loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  gap:16px;
  font-size:28px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.4);
}
.spinner{
  width:32px;height:32px;border-radius:50%;
  border:3px solid rgba(27,82,224,.2);
  border-top-color:#1b52e0;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="stage">

  <div id="header">
    <div class="hdr-left">
      <div>
        <div class="hdr-label">Supercopa AFC 2024</div>
        <div class="hdr-title">CLASSI<span>FICAÇÃO</span></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:20px">
      <div class="hdr-modality" id="hdr-modality">VÔLEI</div>
      <div class="hdr-badge">
        <img src="logo-supercopa.jpg" alt="Supercopa AFC" onerror="this.style.display='none'">
      </div>
    </div>
  </div>

  <div id="divh"></div>

  <div id="loading"><div class="spinner"></div>Carregando…</div>
  <div id="grid" style="display:none"></div>

</div>

<script>
var API='https://hngwasixgyvnvfanpuax.supabase.co/functions/v1/api';
var _ESCUDOS3D='https://www.supercopaafc.com.br/novo/escudos/';
var ESCUDOS_MAP={'alpha vôlei':'alpha-volei.png','ct das montanhas':'ct-das-montanhas.png','ctv aravôlei':'ctv-aravolei.png','ctva voleibol':'ctva-voleibol.png','equipe uvi':'equipe-uvi.png','es vôlei':'es-volei.png','ms vôlei':'ms-volei.png','rpb volei':'rpb-volei.png','super vôlei':'super-volei.png','supra vôlei':'supra-volei.png','tiger volley':'tiger-volley.png','união vôlei':'uniao-volei.png'};
var shields={};

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function initials(n){return n.trim().split(/\s+/).map(function(w){return w[0]||''}).slice(0,3).join('').toUpperCase()}

function badgeHtml(nome){
  var url=shields[norm(nome)];
  if(url)return '<div class="team-badge"><img src="'+esc(url)+'" alt="" onerror="this.parentElement.innerHTML=\'<span class=badge-init>'+esc(initials(nome))+'</span>\'"></div>';
  return '<div class="team-badge"><span class="badge-init">'+esc(initials(nome))+'</span></div>';
}

function grupoHtml(g){
  var rows='';
  (g.tabela||[]).forEach(function(t){
    var cls='pos-'+t.pos;
    rows+='<tr class="'+cls+'">'
      +'<td class="td-pos">'+t.pos+'</td>'
      +'<td class="td-equipe">'
        +'<div class="team-row">'
          +badgeHtml(t.equipe)
          +'<span class="td-name">'+esc(t.equipe)+'</span>'
        +'</div>'
      +'</td>'
      +'<td>'+t.jogos+'</td>'
      +'<td>'+t.vitorias+'</td>'
      +'<td>'+t.derrotas+'</td>'
      +'<td class="td-pts">'+t.pontos+'</td>'
    +'</tr>';
  });

  var jogos=g.jogosTotal>0?g.jogosFeitos+'/'+g.jogosTotal+' jogos':'';
  return '<div class="grupo-cell">'
    +'<div class="grupo-header">'
      +'<div class="grupo-letra">'+esc(g.grupo)+'</div>'
      +'<div class="grupo-info">'
        +'<div class="grupo-nome">Grupo '+esc(g.grupo)+'</div>'
        +(jogos?'<div class="grupo-sub">'+jogos+'</div>':'')
      +'</div>'
    +'</div>'
    +'<table class="tabela">'
      +'<thead><tr>'
        +'<th class="th-equipe" colspan="2">Time</th>'
        +'<th title="Jogos">J</th>'
        +'<th title="Vitórias">V</th>'
        +'<th title="Derrotas">D</th>'
        +'<th title="Pontos">PTS</th>'
      +'</tr></thead>'
      +'<tbody>'+rows+'</tbody>'
    +'</table>'
  +'</div>';
}

function projetarTabela(grupos,vivos){
  if(!vivos||!vivos.length)return grupos;
  return grupos.map(function(g){
    var tab=g.tabela.map(function(t){return Object.assign({},t,{_proj:false})});
    var idx={};
    tab.forEach(function(t,i){idx[String(t.equipe||'').trim().toLowerCase()]=i});
    vivos.forEach(function(p){
      var cN=String(p.equipeCasa||'').trim().toLowerCase();
      var vN=String(p.equipeVisitante||'').trim().toLowerCase();
      var iA=idx[cN],iB=idx[vN];
      if(iA==null||iB==null)return;
      var cL=(p.setsCasa||0)>(p.setsVisitante||0)||((p.setsCasa||0)===(p.setsVisitante||0)&&(p.pontosCasa||0)>(p.pontosVisitante||0));
      var vL=(p.setsVisitante||0)>(p.setsCasa||0)||((p.setsCasa||0)===(p.setsVisitante||0)&&(p.pontosVisitante||0)>(p.pontosCasa||0));
      if(!cL&&!vL)return;
      var wI=cL?iA:iB,lI=cL?iB:iA;
      var wS=cL?(p.setsCasa||0):(p.setsVisitante||0),lS=cL?(p.setsVisitante||0):(p.setsCasa||0);
      var finW=2,finL=wS>lS?lS:1;
      var pW=finL===0?3:2,pL=finL===0?0:1;
      tab[wI]=Object.assign({},tab[wI],{pontos:(tab[wI].pontos||0)+pW,vitorias:(tab[wI].vitorias||0)+1,jogos:(tab[wI].jogos||0)+1,saldoSets:(tab[wI].saldoSets||0)+(finW-finL),_proj:true});
      tab[lI]=Object.assign({},tab[lI],{pontos:(tab[lI].pontos||0)+pL,jogos:(tab[lI].jogos||0)+1,saldoSets:(tab[lI].saldoSets||0)-(finW-finL),_proj:true});
    });
    var sorted=tab.slice().sort(function(a,b){return(b.pontos-a.pontos)||(b.vitorias-a.vitorias)||(b.saldoSets-a.saldoSets)||((b.saldoPontos||0)-(a.saldoPontos||0))});
    sorted.forEach(function(t,i){t.pos=i+1});
    return Object.assign({},g,{tabela:sorted});
  });
}

async function carregar(){
  try{
    var [torneioRes,timesRes,vRes]=await Promise.all([
      fetch(API+'?action=torneio&modalidade=volei',{signal:AbortSignal.timeout(8000)}).then(function(r){return r.json()}),
      fetch(API+'?action=timesPublicos',{signal:AbortSignal.timeout(8000)}).then(function(r){return r.json()}).catch(function(){return{times:[]}}),
      fetch(API+'?action=partidasAoVivo',{signal:AbortSignal.timeout(8000)}).then(function(r){return r.json()}).catch(function(){return{partidas:[]}})
    ]);

    // preencher escudos do API e sobrescrever com os 3D do site
    (timesRes.times||[]).forEach(function(t){
      if(!t.escudo)return;
      var url=t.escudo.startsWith('http')?t.escudo:'https://hngwasixgyvnvfanpuax.supabase.co/storage/v1/object/public/'+t.escudo;
      shields[norm(t.nome)]=url;
    });
    Object.keys(ESCUDOS_MAP).forEach(function(k){shields[k]=_ESCUDOS3D+ESCUDOS_MAP[k]});

    var vivos=vRes.partidas||[];
    var grupos=projetarTabela(torneioRes.grupos||[],vivos);
    var html=grupos.map(grupoHtml).join('');
    var grid=document.getElementById('grid');
    grid.innerHTML=html;
    document.getElementById('loading').style.display='none';
    grid.style.display='grid';

    // atualizar label de modalidade
    if(torneioRes.modalidade){
      var mod={'volei':'VÔLEI','basquete':'BASQUETE','futsal':'FUTSAL'};
      document.getElementById('hdr-modality').textContent=mod[torneioRes.modalidade]||torneioRes.modalidade.toUpperCase();
    }
  }catch(e){
    document.getElementById('loading').innerHTML='<span>Erro ao carregar dados</span>';
    console.error(e);
  }
}

carregar();
// atualizar a cada 60s
setInterval(carregar,60000);

// escala OBS
(function(){
  var W=1920,H=1080,st=document.getElementById('stage');
  function resize(){
    var s=Math.min(innerWidth/W,innerHeight/H);
    st.style.transform='scale('+s+')';
    st.style.left=Math.round((innerWidth-W*s)/2)+'px';
    st.style.top=Math.round((innerHeight-H*s)/2)+'px';
  }
  resize();window.addEventListener('resize',resize);
})();
</script>
</body>
</html>
